<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02A79E">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Không tìm thấy trang — 404</title>
<style>
  :root{
    --bg:#EEF3F5; --surface:#FFFFFF; --ink:#12222B; --muted:#5B6B74; --line:#D7E0E5; --bn:#1B66B3; --bn-soft:#DCEAF8;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0E171C; --surface:#16232A; --ink:#E6EEF1; --muted:#8FA2AC; --line:#2A3C45; --bn:#5BA3E8; --bn-soft:#1A3247; }
  }
  :root[data-theme="dark"]{ --bg:#0E171C; --surface:#16232A; --ink:#E6EEF1; --muted:#8FA2AC; --line:#2A3C45; --bn:#5BA3E8; --bn-soft:#1A3247; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 32px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 50px -30px rgba(0,0,0,.25)}
  .code{font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--bn);background:var(--bn-soft);display:inline-block;padding:4px 14px;border-radius:999px;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--muted);margin:0 0 24px}
  .links{display:flex;flex-direction:column;gap:10px}
  a.btn{display:block;text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
  a.btn.primary{background:var(--bn);color:#fff}
  a.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  a.btn:active{opacity:.85}
</style>
</head>
<body>
  <div class="card">
    <span class="code">LỖI 404</span>
    <h1>Không tìm thấy trang này</h1>
    <p>Đường dẫn bạn vào không tồn tại hoặc đã được thay đổi. Kiểm tra lại địa chỉ, hoặc quay về một trong các trang dưới đây.</p>
    <div class="links">
      <a class="btn primary" href="/kiemtra/admin.html">Trang quản trị kiểm tra</a>
      <a class="btn ghost" href="/kiemtra/index.html">Trang làm bài kiểm tra</a>
      <a class="btn ghost" href="/">Trang chủ</a>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị khảo sát</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a33;--mute:#5b6b76;--paper:#f4f6f5;--card:#fff;--line:#d9e0e3;--accent:#0f766e;--accent-ink:#fff;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef0;--mute:#9db0b9;--paper:#12191d;--card:#1a242a;--line:#2d3b43;--accent:#2dd4bf;--accent-ink:#06211e;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:900px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=password],input[type=datetime-local],textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 200px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink);font-size:15px}.chk input{accent-color:var(--accent)}
button{font:inherit;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:inherit}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.d{color:var(--err)}
.q{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.q .head{display:flex;gap:8px;align-items:center;margin-bottom:6px}.q .head select{width:auto}.q .head .sp{flex:1}
.list-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list-item:first-child{border-top:0}
.link{font-size:13px;color:var(--mute);word-break:break-all}
.note{font-size:13px;color:var(--mute)}.bad{color:var(--err)}
.ok{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.bar{height:8px;background:var(--accent);border-radius:4px;min-width:2px}
.stat{display:grid;grid-template-columns:minmax(120px,40%) 1fr 56px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Quản trị khảo sát</h1>
  <p class="sub">Tạo phiếu khảo sát, lấy link <code>/kiemtra/ks=mã</code> và xem kết quả. <a href="/kiemtra/admin">← Về quản trị bài kiểm tra</a></p>

  <section class="card" id="auth" hidden><strong>Cần đăng nhập quản trị.</strong><p class="note">Hãy đăng nhập tại <a href="/kiemtra/admin" target="_blank" rel="noopener">/kiemtra/admin</a> bằng tài khoản quản trị, rồi quay lại đây và <a href="" onclick="location.reload();return false">tải lại trang</a>.</p><div class="bad" id="autherr" role="alert"></div></section>

  <div id="panel" hidden>
    <section class="card">
      <div class="row"><h2 style="flex:1 1 auto">Danh sách khảo sát</h2><button class="p" id="new" style="flex:0 0 auto">＋ Tạo khảo sát</button></div>
      <div id="list"></div>
    </section>

    <section class="card" id="editor" hidden>
      <h2 id="etitle">Tạo khảo sát</h2>
      <div class="row">
        <div><label for="code">Mã khảo sát (chữ thường, số, gạch ngang — dùng trong link)</label><input type="text" id="code"></div>
        <div><label for="title">Tên khảo sát</label><input type="text" id="title"></div>
      </div>
      <label for="desc">Mô tả ngắn (tuỳ chọn)</label><textarea id="desc"></textarea>
      <label for="thanks">Lời cảm ơn sau khi gửi (tuỳ chọn)</label><input type="text" id="thanks">
      <div class="row">
        <div><label for="closeAt">Tự đóng lúc (trống = không đóng)</label><input type="datetime-local" id="closeAt"></div>
      </div>
      <div class="chk"><input type="checkbox" id="ident"><label for="ident" style="margin:0;font-size:15px;color:inherit">Bắt nhập mã nhân viên và họ tên (mỗi mã chỉ gửi 1 lần)</label></div>
      <div class="chk"><input type="checkbox" id="open" checked><label for="open" style="margin:0;font-size:15px;color:inherit">Đang mở nhận trả lời</label></div>

      <h2 style="margin-top:18px">Câu hỏi</h2>
      <div id="qs"></div>
      <button id="addq">＋ Thêm câu hỏi</button>
      <div class="row" style="margin-top:16px;justify-content:flex-start">
        <button class="p" id="save" style="flex:0 0 auto">Lưu khảo sát</button>
        <button id="cancel" style="flex:0 0 auto">Đóng</button>
        <span id="savemsg" role="status"></span>
      </div>
    </section>

    <section class="card" id="results" hidden>
      <div class="row"><h2 id="rtitle" style="flex:1 1 auto">Kết quả</h2><button id="csv" style="flex:0 0 auto">Tải CSV</button><button id="rclose" style="flex:0 0 auto">Đóng</button></div>
      <div id="rbody"></div>
    </section>
  </div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var cur=null, lastResults=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function api(op,params,body){
    var url='/api/ks-admin?op='+op+(params?'&'+params:'');
    var o={credentials:'same-origin',headers:{'X-Requested-With':'livotec'}};
    if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(Object.assign({op:op},body));url='/api/ks-admin'}
    return fetch(url,o).then(function(r){return r.json().then(function(j){
      if(r.status===401||r.status===403){var e=new Error(j.error||'Chưa được phép.');e.auth=true;throw e}
      if(!r.ok||j.ok===false)throw new Error(j.error||'Lỗi');return j})});
  }
  function enter(){
    api('list').then(function(j){$('auth').hidden=true;$('panel').hidden=false;renderList(j.items)})
    .catch(function(e){$('panel').hidden=true;$('auth').hidden=false;$('autherr').textContent=e.auth?e.message:'Lỗi: '+e.message});
  }
  enter();

  function origin(){return location.origin}
  function renderList(items){
    if(!items.length){$('list').innerHTML='<p class="note">Chưa có khảo sát nào. Bấm "Tạo khảo sát" để bắt đầu.</p>';return}
    $('list').innerHTML=items.map(function(s){
      var link=origin()+'/kiemtra/ks='+s.code;
      return '<div class="list-item"><div><strong>'+esc(s.title)+'</strong> '+(s.open?'<span class="ok">đang mở</span>':'<span class="note">đã đóng</span>')
      +'<div class="link">'+esc(link)+'</div></div><div class="row" style="flex:0 0 auto">'
      +'<button data-a="copy" data-c="'+esc(s.code)+'">Sao chép link</button>'
      +'<button data-a="view" data-c="'+esc(s.code)+'">Kết quả</button>'
      +'<button data-a="edit" data-c="'+esc(s.code)+'">Sửa</button>'
      +'<button class="d" data-a="del" data-c="'+esc(s.code)+'">Xoá</button></div></div>';
    }).join('');
  }
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var c=b.dataset.c,a=b.dataset.a;
    if(a==='copy'){navigator.clipboard.writeText(origin()+'/kiemtra/ks='+c).then(function(){b.textContent='Đã sao chép'});setTimeout(function(){b.textContent='Sao chép link'},1500)}
    if(a==='edit')api('get','code='+encodeURIComponent(c)).then(function(j){openEditor(j.survey)}).catch(function(e){alert(e.message)});
    if(a==='view')showResults(c);
    if(a==='del'&&confirm('Xoá khảo sát "'+c+'"? Kết quả đã thu vẫn nằm trong kho dữ liệu nhưng link sẽ ngừng hoạt động.'))
      api('delete',null,{code:c}).then(refresh).catch(function(e){alert(e.message)});
  });
  function refresh(){api('list').then(function(j){renderList(j.items)})}

  // ---- editor ----
  var qs=[];
  $('new').onclick=function(){openEditor({code:'',title:'',description:'',thanks:'',askIdentity:false,open:true,closeAt:0,questions:[{type:'single',text:'',required:true,options:['','']}]},true)};
  function toLocal(ms){if(!ms)return '';var d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
  function openEditor(s,isNew){
    cur=s;$('results').hidden=true;$('editor').hidden=false;
    $('etitle').textContent=isNew?'Tạo khảo sát':'Sửa khảo sát';
    $('code').value=s.code;$('code').disabled=!isNew;$('title').value=s.title;$('desc').value=s.description;
    $('thanks').value=s.thanks;$('closeAt').value=toLocal(s.closeAt);$('ident').checked=!!s.askIdentity;$('open').checked=s.open!==false;
    qs=JSON.parse(JSON.stringify(s.questions));drawQs();$('savemsg').textContent='';
    $('editor').scrollIntoView({behavior:'smooth'});
  }
  var TYPES=[['single','Chọn một đáp án'],['multi','Chọn nhiều đáp án'],['rating','Thang điểm 1–5'],['text','Trả lời tự do']];
  function drawQs(){
    $('qs').innerHTML=qs.map(function(q,i){
      var h='<div class="q" data-i="'+i+'"><div class="head"><strong>Câu '+(i+1)+'</strong><select data-f="type">'
        +TYPES.map(function(t){return '<option value="'+t[0]+'"'+(q.type===t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('')
        +'</select><span class="sp"></span><label class="chk" style="margin:0"><input type="checkbox" data-f="required"'+(q.required?' checked':'')+'>Bắt buộc</label>'
        +'<button data-f="up" aria-label="Chuyển lên">↑</button><button data-f="down" aria-label="Chuyển xuống">↓</button><button class="d" data-f="rm" aria-label="Xoá câu">✕</button></div>'
        +'<input type="text" data-f="text" placeholder="Nội dung câu hỏi" value="'+esc(q.text)+'">';
      if(q.type==='single'||q.type==='multi'){
        h+='<label>Phương án (mỗi dòng một phương án)</label><textarea data-f="options">'+esc((q.options||[]).join('\n'))+'</textarea>';
      }else if(q.type==='rating'){
        h+='<div class="row"><div><label>Nhãn mức thấp</label><input type="text" data-f="low" value="'+esc(q.low||'')+'" placeholder="Rất không hài lòng"></div>'
          +'<div><label>Nhãn mức cao</label><input type="text" data-f="high" value="'+esc(q.high||'')+'" placeholder="Rất hài lòng"></div></div>';
      }
      return h+'</div>';
    }).join('');
  }
  $('qs').addEventListener('input',function(e){
    var f=e.target.dataset.f,box=e.target.closest('.q');if(!f||!box)return;var q=qs[+box.dataset.i];
    if(f==='options')q.options=e.target.value.split('\n');
    else if(f==='required')q.required=e.target.checked;
    else if(f!=='type')q[f]=e.target.value;
  });
  $('qs').addEventListener('change',function(e){
    if(e.target.dataset.f!=='type')return;var q=qs[+e.target.closest('.q').dataset.i];q.type=e.target.value;
    if((q.type==='single'||q.type==='multi')&&!(q.options&&q.options.length))q.options=['',''];drawQs();
  });
  $('qs').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var i=+b.closest('.q').dataset.i,f=b.dataset.f;
    if(f==='rm')qs.splice(i,1);
    else if(f==='up'&&i>0)qs.splice(i-1,0,qs.splice(i,1)[0]);
    else if(f==='down'&&i<qs.length-1)qs.splice(i+1,0,qs.splice(i,1)[0]);
    else return;drawQs();
  });
  $('addq').onclick=function(){qs.push({type:'single',text:'',required:false,options:['','']});drawQs()};
  $('cancel').onclick=function(){$('editor').hidden=true};
  $('save').onclick=function(){
    var m=$('savemsg');m.className='';m.textContent='Đang lưu…';
    var body={code:$('code').value.trim().toLowerCase(),title:$('title').value,description:$('desc').value,thanks:$('thanks').value,
      askIdentity:$('ident').checked,open:$('open').checked,closeAt:$('closeAt').value?Date.parse($('closeAt').value):0,
      questions:qs.map(function(q){var o=Object.assign({},q);if(o.options)o.options=o.options.map(function(x){return x.trim()}).filter(Boolean);return o})};
    api('save',null,body)
    .then(function(j){m.className='ok';m.textContent='Đã lưu. Link: '+origin()+j.link;$('code').disabled=true;refresh()})
    .catch(function(e){m.className='bad';m.textContent=e.message});
  };

  // ---- results ----
  function showResults(code){
    $('editor').hidden=true;$('results').hidden=false;$('rbody').textContent='Đang tải…';$('rtitle').textContent='Kết quả: '+code;
    Promise.all([api('get','code='+encodeURIComponent(code)),api('results','code='+encodeURIComponent(code))]).then(function(r){
      var s=r[0].survey,rows=r[1].rows;lastResults={s:s,rows:rows};$('rtitle').textContent='Kết quả: '+s.title+' ('+rows.length+' phiếu)';
      if(!rows.length){$('rbody').innerHTML='<p class="note">Chưa có ai trả lời.</p>';return}
      var h='';
      s.questions.forEach(function(q,i){
        h+='<h2 style="margin-top:18px">Câu '+(i+1)+'. '+esc(q.text)+'</h2>';
        var vals=rows.map(function(r){return r.answers[i]}).filter(function(v){return v!==null});
        h+='<div class="note">'+vals.length+'/'+rows.length+' người trả lời</div>';
        if(q.type==='single'||q.type==='multi'){
          var cnt=q.options.map(function(){return 0});
          vals.forEach(function(v){(Array.isArray(v)?v:[v]).forEach(function(k){cnt[k]++})});
          q.options.forEach(function(o,k){var p=vals.length?Math.round(cnt[k]*100/vals.length):0;
            h+='<div class="stat"><span>'+esc(o)+'</span><div><div class="bar" style="width:'+p+'%"></div></div><span>'+cnt[k]+' ('+p+'%)</span></div>'});
        }else if(q.type==='rating'){
          var c=[0,0,0,0,0],sum=0;vals.forEach(function(v){c[v-1]++;sum+=v});
          h+='<div class="note">Điểm trung bình: <strong>'+(vals.length?(sum/vals.length).toFixed(2):'—')+'</strong> / 5</div>';
          c.forEach(function(n,k){var p=vals.length?Math.round(n*100/vals.length):0;
            h+='<div class="stat"><span>'+(k+1)+' điểm</span><div><div class="bar" style="width:'+p+'%"></div></div><span>'+n+' ('+p+'%)</span></div>'});
        }else{
          h+='<div class="scroll"><table><tbody>'+vals.map(function(v){return '<tr><td>'+esc(v)+'</td></tr>'}).join('')+'</tbody></table></div>';
        }
      });
      $('rbody').innerHTML=h;
    }).catch(function(e){$('rbody').innerHTML='<p class="bad">'+esc(e.message)+'</p>'});
  }
  $('rclose').onclick=function(){$('results').hidden=true};
  $('csv').onclick=function(){
    if(!lastResults)return;var s=lastResults.s,rows=lastResults.rows;
    function cell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
    var head=['Thời gian','Mã NV','Họ tên'].concat(s.questions.map(function(q,i){return 'C'+(i+1)+'. '+q.text}));
    var lines=[head.map(cell).join(',')];
    rows.forEach(function(r){
      var a=r.answers.map(function(v,i){var q=s.questions[i];if(v===null)return '';
        if(q.type==='single')return q.options[v];if(q.type==='multi')return v.map(function(k){return q.options[k]}).join('; ');return v});
      lines.push([new Date(r.submittedAt).toLocaleString('vi-VN'),r.empId,r.name].concat(a).map(cell).join(','));
    });
    var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='khao-sat-'+s.code+'.csv';el.click();URL.revokeObjectURL(u);
  };
})();
</script>
</body>
</html>

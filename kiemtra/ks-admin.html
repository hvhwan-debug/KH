<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị khảo sát</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a33;--mute:#5b6b76;--paper:#f4f6f5;--card:#fff;--line:#d9e0e3;--accent:#0f766e;--accent-ink:#fff;--soft:#e6f3f1;--warn:#fff4d6;--err:#b42318;--ok:#0f766e}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef0;--mute:#9db0b9;--paper:#12191d;--card:#1a242a;--line:#2d3b43;--accent:#2dd4bf;--accent-ink:#06211e;--soft:#16302d;--warn:#3a3217;--err:#ff8a80;--ok:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 10px}h3{font-size:1rem;margin:16px 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{background:var(--card)}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 180px}.row>.nf{flex:0 0 auto}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}.chk input{accent-color:var(--accent);width:16px;height:16px}
button{font:inherit;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:inherit}
button:hover{background:var(--soft)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}button.p:hover{background:var(--accent)}
button.d{color:var(--err)}
button.sm{padding:3px 9px;font-size:13px}
.note{font-size:13px;color:var(--mute)}.bad{color:var(--err)}.ok{color:var(--ok)}
.warn{background:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin:10px 0}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.li:first-child{border-top:0}
.li .meta{flex:1 1 280px;min-width:0}.li .link{font-size:13px;color:var(--mute);word-break:break-all}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--ok);margin-left:6px}
.badge.off{background:var(--line);color:var(--mute)}.badge.wait{background:var(--warn);color:var(--ink)}
.qc{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.qc.sec{background:var(--soft);border-style:dashed}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qh .no{font-weight:700;min-width:28px}.qh select{width:auto;flex:0 1 220px}.qh .sp{flex:1}
.qh .chk{margin:0}
details.lg{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.lg summary{cursor:pointer;color:var(--mute);font-size:13px}
.rule{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.rule select,.rule input{width:auto;flex:1 1 130px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:1.4rem}.kpi span{font-size:13px;color:var(--mute)}
.rq{border-top:1px solid var(--line);padding:12px 0}.rq:first-child{border-top:0}
.rq h4{margin:0 0 2px;font-size:1rem}
.bar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 84px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.bar .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .v{text-align:right;color:var(--mute);font-size:13px}.bar .l{overflow-wrap:anywhere}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0}.stack i{display:block}
.pro{background:#16a34a}.pas{background:#eab308}.det{background:#dc2626}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
td.c,th.c{text-align:center}
.txts{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-top:6px}
.txts p{margin:6px 0;padding-bottom:6px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.txts p:last-child{border:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Quản trị khảo sát</h1>
  <p class="sub">Tạo phiếu, chia trang, đặt logic hiện/ẩn câu, lấy link <code>/kiemtra/ks=mã</code> và xem báo cáo. <a href="/kiemtra/admin">← Về quản trị bài kiểm tra</a></p>

  <section class="card" id="auth" hidden><strong>Cần đăng nhập quản trị.</strong>
    <p class="note">Hãy đăng nhập tại <a href="/kiemtra/admin" target="_blank" rel="noopener">/kiemtra/admin</a> bằng tài khoản quản trị, rồi <a href="" onclick="location.reload();return false">tải lại trang</a> này.</p>
    <div class="bad" id="autherr" role="alert"></div></section>

  <div id="panel" hidden>
    <section class="card">
      <div class="row"><h2 class="nf" style="margin:0;flex:1 1 auto">Danh sách khảo sát</h2>
        <select id="tpl" class="nf" aria-label="Tạo từ mẫu" style="width:auto"><option value="">Tạo từ mẫu…</option></select>
        <button class="p nf" id="new">＋ Tạo khảo sát trống</button></div>
      <div id="list"></div>
    </section>

    <section class="card" id="editor" hidden></section>
    <section class="card" id="results" hidden></section>
  </div>
</main>
<script src="/kiemtra/ks-admin.js"></script>
</body>
</html>

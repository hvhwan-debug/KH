<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Đăng ký chương trình học</title>
<link rel="icon" href="/kiemtra/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#1559C4;--navy:#0A1F44;--ink:#101B33;--body:#3B465C;--muted:#6B7690;--line:#E3E8F1;--ok:#16A34A;--okbg:#E7F7EE;--warn:#B45309;--warnbg:#FFF4DE;--bad:#B6372E;--badbg:#FDECEA}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--body);background:radial-gradient(80% 60% at 10% 0%,#DCEBFF 0%,transparent 60%),radial-gradient(70% 60% at 100% 100%,#E2F7EE 0%,transparent 60%),#F3F6FB;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:min(560px,100%);background:#fff;border-radius:24px;box-shadow:0 30px 70px -30px rgba(10,40,100,.35);border:1px solid #E6EDF7;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--navy)}
.top img{width:28px;height:28px;border-radius:8px}
.main{padding:30px 28px 26px;text-align:center}
.ic{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:40px}
.ic.ok{background:var(--okbg);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ic.warn{background:var(--warnbg);color:var(--warn)}.ic.bad{background:var(--badbg);color:var(--bad)}.ic.wait{background:#EAF2FF}
.ic svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic.ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid #CFE0FA;border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:0 0 8px;font-size:clamp(22px,5vw,27px);font-weight:900;color:var(--navy);letter-spacing:-.4px;line-height:1.25}
.lead{margin:0 auto;max-width:430px;font-size:15px;line-height:1.6}
.prog{margin:22px 0 0;text-align:left;background:#F6F9FE;border:1px solid #E1EAF7;border-radius:16px;padding:16px 18px}
.prog .t{font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.35}
.prog .d{margin:6px 0 0;font-size:14px;line-height:1.6;white-space:pre-line}
.prog dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14px}
.prog dt{color:var(--muted)}.prog dd{margin:0;font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 30px;margin-top:22px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 26px -12px rgba(22,163,74,.7)}
.btn:disabled{opacity:.6;cursor:default}
.link{margin-top:18px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.foot{padding:14px 22px;border-top:1px solid var(--line);font-size:12px;color:#94A0B8;text-align:center}
.hide{display:none!important}
</style>
</head>
<body>
<div class="card" role="main">
  <div class="top"><img src="/kiemtra/logo-mark.png" alt=""><span>Hệ thống kiểm tra đánh giá trực tuyến · Đăng ký chương trình học</span></div>
  <div class="main" id="box">
    <div class="ic wait"><div class="spin" aria-hidden="true"></div></div>
    <h1>Đang ghi nhận đăng ký…</h1>
    <p class="lead">Vui lòng chờ trong giây lát.</p>
  </div>
  <div class="foot">Có thắc mắc về chương trình, vui lòng liên hệ người gửi thư mời.</div>
</div>
<noscript><p style="text-align:center">Trình duyệt đang tắt JavaScript nên chưa đăng ký được. Hãy bật JavaScript rồi mở lại liên kết trong email.</p></noscript>
<script>
(function(){
'use strict';
var T = ''; try { T = new URLSearchParams(location.search).get('t') || ''; } catch (e) {}
var box = document.getElementById('box'), D = null;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function vn(ms){ if (!ms) return ''; var d = new Date(ms + 7 * 3600e3); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ' ngày ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
var IC = { ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', warn:'<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>', bad:'<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>', info:'<svg viewBox="0 0 24 24"><path d="M12 11v6M12 7h.01"/><circle cx="12" cy="12" r="9.5"/></svg>' };
function api(method, body){
  return fetch('/api/program-join' + (method === 'GET' ? '?t=' + encodeURIComponent(T) : ''), { method: method, credentials:'same-origin', headers:{ 'Content-Type':'application/json', 'X-Requested-With':'livotec' }, body: body ? JSON.stringify(Object.assign({ t:T }, body)) : undefined })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, error:'Máy chủ không phản hồi, vui lòng thử lại.' }; }); }, function(){ return { ok:false, error:'Không kết nối được máy chủ. Kiểm tra mạng rồi mở lại liên kết trong email.' }; });
}
function progBox(p){
  var rows = [['Thời gian', p.when], ['Địa điểm / hình thức', p.where], ['Hạn đăng ký', p.deadline ? vn(p.deadline) : ''], ['Chỗ còn lại', p.capacity ? p.left + ' / ' + p.capacity : ''], ['Liên hệ', p.contact]].filter(function(r){ return r[1] !== '' && r[1] != null; });
  return '<div class="prog"><div class="t">' + esc(p.title) + '</div>' + (p.desc ? '<p class="d">' + esc(p.desc) + '</p>' : '') +
    (rows.length ? '<dl>' + rows.map(function(r){ return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' : '') + '</div>';
}
function show(kind, title, lead, extra){
  box.innerHTML = '<div class="ic ' + kind + '">' + (IC[kind] || IC.info) + '</div><h1>' + title + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + (extra || '');
}
function who(){ return D && D.name ? ' <b>' + esc(D.name) + '</b>' : ''; }
function render(j, fresh){
  if (!j.ok){ show('bad', 'Chưa đăng ký được', esc(j.error || 'Đã có lỗi xảy ra.')); return; }
  D = j; var p = j.program;
  if (j.state === 'registered'){
    show('ok', (j.already || !fresh) ? 'Bạn đã đăng ký rồi' : 'Đăng ký thành công!',
      ((j.already || !fresh) ? 'Hệ thống đã ghi nhận' + who() + ' đăng ký' + (j.regAt ? ' lúc ' + vn(j.regAt) : '') + '.' : 'Cảm ơn' + who() + '! Bạn đã có tên trong danh sách tham gia.') + ' Không cần làm gì thêm.',
      progBox(p) + (j.locked ? '<p class="lead" style="margin-top:14px;font-size:13px">Đã hết hạn đăng ký nên không thể tự huỷ. Cần thay đổi, vui lòng liên hệ người gửi thư mời.</p>' : '<button type="button" class="link" id="bCancel">Tôi không thể tham gia, huỷ đăng ký</button>'));
    var c = document.getElementById('bCancel'); if (c) c.onclick = function(){ if (confirm('Huỷ đăng ký chương trình "' + p.title + '"?')){ c.disabled = true; api('POST', { op:'cancel' }).then(function(r){ render(r); }); } };
    return;
  }
  var again = '<button type="button" class="btn" id="bJoin">✅ Đăng ký tham gia</button>';
  if (j.state === 'open') show(j.cancelled ? 'info' : 'info', j.cancelled ? 'Đã huỷ đăng ký' : 'Xác nhận tham gia', j.cancelled ? 'Bạn đã huỷ đăng ký. Đổi ý thì bấm nút bên dưới để đăng ký lại.' : 'Bấm nút bên dưới để đăng ký.', progBox(p) + again);
  else if (j.state === 'full') show('warn', 'Chương trình đã đủ chỗ', 'Rất tiếc, số chỗ đã được đăng ký hết. Vui lòng liên hệ người gửi thư mời nếu bạn vẫn muốn tham gia.', progBox(p));
  else if (j.state === 'expired') show('warn', 'Đã hết hạn đăng ký', 'Hạn đăng ký đã qua' + (p.deadline ? ' (' + vn(p.deadline) + ')' : '') + '. Vui lòng liên hệ người gửi thư mời.', progBox(p));
  else show('warn', 'Chương trình đã đóng đăng ký', 'Vui lòng liên hệ người gửi thư mời nếu bạn muốn tham gia.', progBox(p));
  var b = document.getElementById('bJoin'); if (b) b.onclick = function(){ b.disabled = true; api('POST', { op:'join' }).then(function(r){ render(r, true); }); };
}
if (!T){ show('bad', 'Liên kết chưa đầy đủ', 'Hãy mở lại liên kết từ email mời, hoặc sao chép đầy đủ đường dẫn vào trình duyệt.'); return; }
// Một thao tác: người nhận bấm nút trong email là trang tự đăng ký luôn.
// Trình duyệt tự động (bộ quét link của hộp thư) thường báo navigator.webdriver: khi đó chỉ hiện thông tin + nút, không tự đăng ký.
var bot = !!navigator.webdriver;
function go(){ api('POST', { op:'join' }).then(function(r){ render(r, true); }); }
if (bot) api('GET').then(function(r){ render(r); });
else if (document.visibilityState === 'hidden') document.addEventListener('visibilitychange', function f(){ if (document.visibilityState === 'visible'){ document.removeEventListener('visibilitychange', f); go(); } });
else go();
})();
</script>
</body>
</html>

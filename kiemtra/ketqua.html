<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#067A8C">
<title>Xác thực kết quả kiểm tra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#067A8C;--brand-deep:#055A68;--brand-soft:#E4F3F5;--accent:#0EB5A6;--violet:#6D5BF6;--ink:#0D2A31;--muted:#4B666D;--line:#DAE5E8;--bg:#EFF5F7;
  --ok:#17794A;--ok-soft:#DDF1E6;--bad:#B3261E;--bad-soft:#FBE3E0;--grad:linear-gradient(135deg,#067A8C 0%,#068073 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 8% -8%,rgba(109,91,246,.16),transparent 62%),
  radial-gradient(760px 480px at 100% 4%,rgba(14,181,166,.18),transparent 60%)}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center}
.top b{display:block;font-size:15px}.top span{display:block;font-size:12.5px;color:var(--muted)}
.card{background:#fff;border:1px solid rgba(218,229,232,.9);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -32px rgba(13,42,49,.45),0 2px 8px rgba(13,42,49,.05)}
.vbar{display:flex;align-items:center;gap:12px;padding:16px 22px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:14px;line-height:1.4}
.vbar svg{flex:0 0 auto}
.vbar.bad{background:var(--bad-soft);color:var(--bad)}
.head{padding:22px 24px;color:#fff;background:linear-gradient(135deg,#043B46 0%,#067A8C 62%,#0C9C8C 100%)}
.head b{display:block;font-size:16px;line-height:1.4}.head small{display:block;font-size:12px;opacity:.85;margin-top:2px}
.body{padding:24px 24px 8px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:8px 18px 8px 14px;border-radius:999px;margin-bottom:14px}
.badge svg{width:18px;height:18px}.badge.y{background:var(--ok-soft);color:var(--ok)}.badge.n{background:var(--bad-soft);color:var(--bad)}.badge.d{background:var(--brand-soft);color:var(--brand-deep)}
.person{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.av{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.person>div>b{display:block;font-size:18px;text-align:left}.person>div>span{display:block;font-size:12.5px;color:var(--muted);text-align:left}
.ring{position:relative;width:170px;height:170px;margin:10px auto 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:#E6EEF0}.ring .prg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring.y .prg{stroke:url(#gY)}.ring.n .prg{stroke:url(#gN)}.ring.d .prg{stroke:url(#gT)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}.ring .c span{font-size:12px;color:var(--muted);margin-top:6px}
.thr{font-size:13px;color:var(--muted);margin:0 0 16px}
.stats{display:grid;gap:10px;text-align:center}
.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.stats.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.stats.c1{grid-template-columns:1fr}
.stats div{background:linear-gradient(180deg,#F4FAFA,#EAF5F6);border:1px solid #D5E9EC;border-radius:16px;padding:14px 10px}
.stats b{display:block;font-size:21px;font-weight:800;color:var(--brand-deep);line-height:1.2}.stats span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.bk{margin:14px 0 0;text-align:left}.bk .bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line);gap:2px}.bk .bar i{display:block;height:100%;background:var(--c)}
.bk .lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--muted)}.bk .lg b{color:var(--ink)}
.bk .lg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--c)}
.kv{border:1.5px solid var(--line);border-radius:16px;padding:2px 18px;margin:16px 0 0;background:#FAFCFC;text-align:left}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:14px}.kv div:first-child{border-top:0}
.kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
.proof{display:flex;align-items:center;gap:14px;margin:16px 0 0;padding:15px 16px;border:1.5px dashed #9FD2CB;border-radius:16px;background:#F2FAF8;text-align:left}
.proof small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}.proof b{display:block;font-size:21px;letter-spacing:.06em;color:var(--brand-deep)}
.proof span{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.foot{padding:16px 24px 22px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.foot b{color:var(--brand-deep)}
.state{padding:44px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo" aria-hidden="true">KT</div><div><b>Nền tảng kiểm tra trực tuyến</b><span>Xác thực kết quả bài kiểm tra</span></div></header>

  <main class="card" id="card">
    <div class="state" id="state">Đang xác thực kết quả…</div>
    <div class="hide" id="okView">
      <div class="vbar" id="vbar"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5.2v6c0 4.7 3.2 8.4 8 9.8 4.8-1.4 8-5.1 8-9.8v-6z" fill="currentColor"/><path d="m8.2 12.3 2.6 2.6 5-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kết quả này đã được hệ thống xác thực</span></div>
      <div class="head"><b id="vTitle"></b><small>Nền tảng kiểm tra trực tuyến</small></div>
      <div class="body">
        <div id="vBadge"></div>
        <div class="person"><span class="av" id="vAv" aria-hidden="true"></span><div><b id="vName"></b><span id="vCode"></span></div></div>
        <div class="ring" id="vRing"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="gY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EB5A6"/><stop offset="1" stop-color="#17794A"/></linearGradient><linearGradient id="gN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F08A4B"/><stop offset="1" stop-color="#B3261E"/></linearGradient><linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EB5A6"/><stop offset="1" stop-color="#067A8C"/></linearGradient></defs><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="prg" id="vArc" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73"/></svg><div class="c"><b id="vPct">0%</b><span>Tỉ lệ đúng</span></div></div>
        <p class="thr" id="vThr"></p>
        <div class="stats" id="vStats"></div>
        <div class="bk hide" id="vBk"></div>
        <dl class="kv" id="vRows"></dl>
        <div class="proof"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5.2v6c0 4.7 3.2 8.4 8 9.8 4.8-1.4 8-5.1 8-9.8v-6z" fill="#17794A"/><path d="m8.2 12.3 2.6 2.6 5-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><small>MÃ MINH CHỨNG</small><b id="vProof"></b><span>Mã này khớp với dữ liệu bài làm trên hệ thống.</span></div></div>
      </div>
      <div class="foot">Xác thực bởi hệ thống lúc <b id="vSys"></b></div>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var ZONE = 'Asia/Ho_Chi_Minh', off = 0;
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function full(ms){ try { return new Date(ms).toLocaleString('vi-VN',{timeZone:ZONE,hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}); } catch(e){ return ''; } }
function dur(sec){ sec = Math.max(0, Math.round(sec||0)); var m = Math.floor(sec/60), s = sec%60; return m+' phút '+(s<10?'0':'')+s+' giây'; }
function clock(sec){ sec = Math.max(0, Math.round(sec||0)); var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60, p = function(x){ return (x<10?'0':'')+x; }; return h ? h+':'+p(m)+':'+p(s) : m+':'+p(s); }
function initials(n){ var p = String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return ((p.length>1?p[0].charAt(0):'')+p[p.length-1].charAt(0)).toUpperCase(); }
function fail(text){ $('state').textContent = text; $('state').classList.remove('hide'); $('okView').classList.add('hide'); }

(async function(){
  var t = new URLSearchParams(location.search).get('t');
  if (!t){ fail('Liên kết không hợp lệ. Hãy quét lại mã QR trên thẻ kết quả.'); return; }
  var res, j;
  try { res = await fetch('/api/kt-verify?t=' + encodeURIComponent(t), { credentials:'same-origin' }); j = await res.json(); }
  catch(e){ fail('Không kết nối được máy chủ, vui lòng thử lại.'); return; }
  if (!j || !j.ok){ fail((j && j.error) || 'Không xác thực được kết quả.'); return; }
  off = (j.serverNow || Date.now()) - Date.now();
  var r = j.result, ps = (r.passed === true || r.passed === false) ? r.passed : null, pct = r.pct == null ? 0 : r.pct;
  document.title = 'Xác thực kết quả - ' + r.name;
  $('vTitle').textContent = r.title;
  $('vName').textContent = r.name || r.code; $('vCode').textContent = r.code ? 'Mã nhân viên: ' + r.code : ''; $('vAv').textContent = initials(r.name || r.code);
  var I_Y = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="m7.5 12.5 3 3 6-7"/></svg>';
  var I_N = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="m9 9 6 6M15 9l-6 6"/></svg>';
  $('vBadge').innerHTML = '<span class="badge '+(ps===null?'d':ps?'y':'n')+'">'+(ps===null?I_Y+'ĐÃ HOÀN THÀNH':ps?I_Y+'ĐẠT':I_N+'CHƯA ĐẠT')+'</span>';
  $('vRing').className = 'ring ' + (ps===null?'d':ps?'y':'n'); $('vPct').textContent = pct + '%';
  $('vThr').textContent = (ps !== null && r.passScore) ? 'Ngưỡng đạt: ' + r.passScore + '%' : '';
  var tl = [{v:(r.score!=null?r.score:'–')+'/'+(r.total!=null?r.total:'–'),l:'Số câu đúng'}];
  if (r.compliancePoints != null) tl.push({v:r.compliancePoints+' điểm',l:'Điểm tuân thủ học tập'});
  if (r.durationSec != null) tl.push({v:clock(r.durationSec),l:'Thời gian hoàn thành'});
  $('vStats').className = 'stats c' + tl.length;
  $('vStats').innerHTML = tl.map(function(x){ return '<div><b>'+esc(x.v)+'</b><span>'+x.l+'</span></div>'; }).join('');
  if (r.wrong != null && r.blank != null && r.total){
    var seg = [{n:r.score||0,c:'#17794A',l:'Đúng'},{n:r.wrong,c:'#B3261E',l:'Sai'},{n:r.blank,c:'#AEBDC1',l:'Bỏ trống'}];
    $('vBk').innerHTML = '<div class="bar" aria-hidden="true">'+seg.map(function(g){ return g.n>0?'<i style="--c:'+g.c+';width:'+(g.n/r.total*100)+'%"></i>':''; }).join('')+'</div><div class="lg">'+seg.map(function(g){ return '<span style="--c:'+g.c+'">'+g.l+' <b>'+g.n+'</b></span>'; }).join('')+'</div>';
    $('vBk').classList.remove('hide');
  }
  var rows = '';
  if (r.startedAt) rows += '<div><dt>Bắt đầu lúc</dt><dd>'+full(r.startedAt)+'</dd></div>';
  if (r.submittedAt) rows += '<div><dt>Nộp bài lúc</dt><dd>'+full(r.submittedAt)+'</dd></div>';
  if (r.durationSec != null) rows += '<div><dt>Thời gian hoàn thành</dt><dd>'+dur(r.durationSec)+'</dd></div>';
  $('vRows').innerHTML = rows; $('vProof').textContent = r.proof;
  $('vSys').textContent = full(Date.now() + off);
  setInterval(function(){ $('vSys').textContent = full(Date.now() + off); }, 1000);
  $('state').classList.add('hide'); $('okView').classList.remove('hide');
  var arc = $('vArc');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ arc.style.strokeDashoffset = String(326.73 * (1 - Math.max(0, Math.min(100, pct)) / 100)); }); });
})();
})();
</script>
</body>
</html>

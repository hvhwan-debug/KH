<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản lý ASM · Nền tảng quản lí báo cáo nhân sự SR</title>
<meta name="theme-color" content="#02A79E">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5;--surface:#fff;--surface2:#F6F9FA;--ink:#12222B;--muted:#5B6B74;--line:#D7E0E5;--on:#fff;
  --brand:#02A79E;--brand-deep:#067A8C;--n1:#0B86C2;--n1-soft:#DCEFF9;--n2:#D8481F;--n2-soft:#FBE3DA;
  --ok:#1E7F4F;--ok-soft:#D9F0E4;--warn:#955D00;--warn-soft:#FBEBC8;--bad:#B3261E;--bad-soft:#F9DAD7;
  --focus:#0B86C2;--shadow:0 1px 2px rgba(18,34,43,.05),0 6px 20px rgba(18,34,43,.06);
  --hero1:#06807F;--hero2:#0B5E9C;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E171C;--surface:#16232A;--surface2:#1B2B33;--ink:#E6EEF1;--muted:#8FA2AC;--line:#2A3C45;--on:#0E171C;
  --brand:#2BC4B9;--brand-deep:#5AD0D6;--n1:#5BB6EA;--n1-soft:#17324A;--n2:#FF8A5E;--n2-soft:#3A2119;
  --ok:#4CC38A;--ok-soft:#14352A;--warn:#E3A63B;--warn-soft:#3A2D10;--bad:#FF8A80;--bad-soft:#3C1B19;--focus:#5BB6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--hero1:#0A4F52;--hero2:#123F66;}}
:root[data-theme="dark"]{
  --bg:#0E171C;--surface:#16232A;--surface2:#1B2B33;--ink:#E6EEF1;--muted:#8FA2AC;--line:#2A3C45;--on:#0E171C;
  --brand:#2BC4B9;--brand-deep:#5AD0D6;--n1:#5BB6EA;--n1-soft:#17324A;--n2:#FF8A5E;--n2-soft:#3A2119;
  --ok:#4CC38A;--ok-soft:#14352A;--warn:#E3A63B;--warn-soft:#3A2D10;--bad:#FF8A80;--bad-soft:#3C1B19;--focus:#5BB6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--hero1:#0A4F52;--hero2:#123F66;}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:600}.nowrap{white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 90px}
svg{display:block}

/* ===== Khung ứng dụng: thanh trên + điều hướng (thanh bên ở máy tính, thanh dưới ở điện thoại) ===== */
:root{--navw:228px;--hh:58px}
.num,.kv,.mv,.sv,table.t td{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:none;margin:0;padding:8px 20px;min-height:var(--hh);display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand img{width:34px;height:34px;border-radius:10px}
.brand b{display:block;font-size:15px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}.brand span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2;white-space:nowrap}
.sp{flex:1}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:2px;flex:0 0 auto}
.datenav button{border:0;background:transparent;border-radius:9px;width:34px;height:34px;color:var(--muted);display:grid;place-items:center}
.datenav button:hover:not([disabled]){background:var(--surface);color:var(--ink)}
.datenav button[disabled]{opacity:.35;cursor:default}
.datenav .dv{padding:0 8px;font-weight:600;font-size:13.5px;min-width:118px;text-align:center;white-space:nowrap}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.pillbtn:hover{border-color:var(--brand)}
.pillbtn.warnb{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pillbtn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pillbtn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn:hover{border-color:var(--brand);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.25;flex:0 0 auto}
.who .av{width:32px;height:32px;font-size:12px}
.topin select.sel{max-width:180px;flex:0 1 auto}

.tabs{position:fixed;z-index:35;display:flex;gap:4px;background:var(--surface)}
.tabs button{border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.tabs svg{flex:0 0 auto}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-weight:700}
@media (min-width:1100px){
  .tabs{left:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;width:var(--navw);flex-direction:column;padding:14px 12px;border-right:1px solid var(--line)}
  .tabs button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:left;font-size:14px}
  .tabs button:hover{background:var(--surface2);color:var(--ink)}
  .tabs button[aria-selected=true]{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand-deep)}
  .tabs .ts{display:none}.tabs .cnt{margin-left:auto}
  .wrap{margin:0 0 0 var(--navw);max-width:1520px;padding:0 24px 48px}
}
@media (max-width:1099px){
  .tabs{left:0;right:0;bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(18,34,43,.07)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:11px;min-height:50px;position:relative}
  .tabs button[aria-selected=true]{color:var(--brand-deep);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
  .tabs .tl{display:none}
  .tabs .cnt{position:absolute;top:2px;left:calc(50% + 6px);line-height:16px;min-width:16px;font-size:10px;padding:0 4px}
  .wrap{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
}
.wrap{margin-top:0}

/* ===== Đầu trang + chỉ số chính ===== */
.phead{display:flex;gap:10px 20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:18px 0 12px}
.phead h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.phead .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.pactions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kt .kl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt .kv{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px;white-space:nowrap}
.kt .kv small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kt .kb{position:relative;height:6px;border-radius:99px;background:var(--surface2);margin:8px 0 6px}
.kt .kb>i{display:block;height:100%;border-radius:inherit;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.kt .kb .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.kt .ks{font-size:12px;color:var(--muted);line-height:1.35}
.kt.ok .kv{color:var(--ok)}.kt.warn .kv{color:var(--warn)}.kt.bad .kv{color:var(--bad)}
.kt.warn .kb>i{background:#E3A63B}.kt.bad .kb>i{background:var(--bad)}.kt.ok .kb>i{background:#2E9D68}
.ngsum{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}.hs b{color:var(--ink);font-weight:700}
@media (max-width:1099px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){
  .phead{margin:14px 0 10px}.phead h1{font-size:20px}
  .pactions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}.pactions::-webkit-scrollbar{display:none}
  .kt{padding:10px 12px}.kt .kv{font-size:20px}
}

/* Khung */
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,2fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card .hsub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.badge.n1{background:var(--n1-soft);color:var(--n1);border-color:transparent}.badge.n2{background:var(--n2-soft);color:var(--n2);border-color:transparent}

/* Feed hành động */
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;padding:10px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);align-items:flex-start}
.fi .fic{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px}
.fi.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--surface))}.fi.bad .fic{background:var(--bad-soft);color:var(--bad)}
.fi.warn{border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}.fi.warn .fic{background:var(--warn-soft);color:var(--warn)}
.fi.info .fic{background:var(--n1-soft);color:var(--n1)}
.fi .ft{font-weight:600;font-size:13.5px;line-height:1.3}.fi .fx{font-size:12.5px;color:var(--muted);margin-top:1px;word-break:break-word}
.fi .fa{margin-left:auto;flex:0 0 auto}
.linkbtn{border:0;background:transparent;color:var(--n1);font-weight:600;font-size:12.5px;padding:4px 6px;border-radius:8px}
.linkbtn:hover{background:var(--n1-soft)}
.allgood{text-align:center;padding:20px 10px;color:var(--muted)}.allgood b{display:block;color:var(--ok);font-size:15px;margin-top:4px}

/* ===== Thanh công cụ danh sách ===== */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;box-shadow:var(--shadow)}
.tb1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segc{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.segc button{border:0;background:transparent;border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;min-height:32px}
.segc button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(18,34,43,.18)}
.segc i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sbox{position:relative;flex:1 1 130px;min-width:120px;max-width:340px;display:flex;align-items:center}
.sbox svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.sbox input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 34px;font-size:13.5px;min-height:38px}
select.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;min-height:38px}
.vt{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.vt button{border:0;background:transparent;border-radius:9px;width:34px;height:32px;display:grid;place-items:center;color:var(--muted)}
.vt button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(18,34,43,.18)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.att{margin-top:12px}.attt{min-width:600px}.attt td:first-child,.attt th:first-child{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}.attt th:first-child{background:var(--surface2)}.attt tr.sub td:first-child{background:var(--surface2)}.attt td{vertical-align:middle}.attt tr.sub td{background:var(--surface2);font-size:12.5px}.attt tr.sub td:first-child{padding-left:22px;color:var(--muted)}.attb{min-width:220px}.attb .prog{height:9px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-areas:"main side";gap:14px;margin-top:12px;align-items:start}
.tmain{grid-area:main;min-width:0}.tside{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:1279px){.tgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "main"}}
.tgrid.tbl{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "main"}
.tgrid.tbl .tside .feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}


/* Thẻ nhân sự */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.sr{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.sr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--n2)}
.sr.n1::before{background:var(--n1)}
.sr.lv-bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.srh{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 auto}
.srh .nm{font-weight:700;font-size:15px;line-height:1.2;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srh .mt{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.srh .tx{min-width:0;flex:1}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.done{background:var(--ok-soft);color:var(--ok)}.st.wait{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st.weekly{background:var(--n1-soft);color:var(--n1)}
.st.late,.st.missed{background:var(--bad-soft);color:var(--bad)}.st.off{background:var(--surface2);color:var(--muted)}.st.future{background:var(--surface2);color:var(--muted)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.met{background:var(--surface2);border-radius:12px;padding:7px 6px 7px 8px;min-width:0}
.met .ml{font-size:10px;text-transform:uppercase;letter-spacing:0;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met .mv{font-size:17px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.met .mv small{font-size:11px;font-weight:500;color:var(--muted)}
.met .mp{font-size:11px;color:var(--muted)}
.met.bad .mv{color:var(--bad)}.met.ok .mv{color:var(--ok)}
.prog{position:relative;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:visible}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--n1));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.prog.warn>i{background:linear-gradient(90deg,#E3A63B,#E8742A)}.prog.bad>i{background:linear-gradient(90deg,#E8742A,var(--bad))}
.prog .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.progrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;gap:8px}
.progrow b{color:var(--ink)}
.note{border-radius:12px;padding:8px 10px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);word-break:break-word}
.note.help{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note b{font-weight:700}
.srf{display:flex;align-items:center;gap:8px}
.srf .spark{flex:1;min-width:0}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-weight:600;font-size:12.5px}
.mini:hover{border-color:var(--brand)}
.mini.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .big{font-size:34px}
.skel{height:130px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Bảng / bản đồ nhiệt */
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th:last-child,table.t td:last-child{border-right:0}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 70%,var(--surface))}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--surface2);border-bottom:2px solid var(--line);position:sticky;top:0}
table.t tfoot td{background:var(--surface2);font-weight:700;border-top:2px solid var(--line);border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
.tcard .tblwrap{border:0;border-radius:0}
.heat{border-collapse:separate;border-spacing:3px;font-size:11px}
.heat th{font-weight:600;color:var(--muted);font-size:10.5px;padding:0 0 2px;text-align:center}
.heat th.today{color:var(--brand-deep)}
.heat td.nm{padding:0 10px 0 0;font-size:13px;font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1;max-width:170px;overflow:hidden;text-overflow:ellipsis}

<body>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
/* ====== Hằng số & tiện ích ====== */
const DEADLINE=19;                       // giờ chốt báo cáo cuối ngày (giờ VN)
const TOKEN_KEY='livotec-sr-token';      // dùng chung phiên đăng nhập với app SR
const NG={1:{n:'Ngành 1',s:'Karofi · Livotec máy lọc',cls:'n1',col:'var(--n1)'},2:{n:'Ngành 2',s:'Livotec gia dụng',cls:'n2',col:'var(--n2)'}};
const DOWL=['CN','T2','T3','T4','T5','T6','T7'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const num=v=>{v=+v;return isFinite(v)?v:0;};
const fmt=(n,d)=>num(n).toLocaleString('vi-VN',{maximumFractionDigits:d||0});
const pc=x=>x==null?'–':Math.round(x*100)+'%';
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const addD=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const dowOf=d=>new Date(d+'T00:00:00Z').getUTCDay();
const dmy=d=>d.slice(8)+'/'+d.slice(5,7);
const lvOf=r=>r==null?'na':r>=0.9?'ok':r>=0.7?'warn':'bad';
const LVT={ok:'Đúng tiến độ',warn:'Hơi chậm',bad:'Cần can thiệp',na:'Chưa có mốc'};
function monthDays(month){const p=month.split('-').map(Number),n=new Date(Date.UTC(p[0],p[1],0)).getUTCDate();return Array.from({length:n},(_,i)=>month+'-'+pad(i+1));}
function ini(name){const w=String(name||'?').trim().split(/\s+/);return ((w.length>1?w[w.length-2][0]:'')+w[w.length-1][0]).toUpperCase();}
function avCol(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return 'hsl('+(h%360)+',48%,42%)';}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},ms||2400);}
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}}
function setToken(t){try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);}catch(e){}}
async function api(method,path,body){
  const h={'Content-Type':'application/json','X-Requested-With':'livotec'},t=getToken();
  if(t)h['X-SR-Token']=t;
  const r=await fetch(path,{method,headers:h,credentials:'same-origin',body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json();}catch(e){}
  return{s:r.status,j:j||{}};
}

/* ====== Trạng thái ====== */
const ST={
  boot:'loading',        // loading | login | denied | ready | error
  me:null,data:null,err:'',
  month:'',today:'',date:'',skew:0,
  tab:'today',ng:0,asm:'',flt:'all',sort:'risk',q:'',
  drawer:null,compose:null,org:null,orgErr:'',
  login:{tab:'login',email:'',name:'',otp:false,msg:'',busy:false},
  ndraft:{},nsel:{},sel:{},sending:false,loadedAt:0,loading:false,ai:{brief:null,coach:{},plan:false}
};
function vnNow(){return new Date(Date.now()+ST.skew+7*36e5);}
function vnToday(){return vnNow().toISOString().slice(0,10);}
function vnHour(){const d=vnNow();return d.getUTCHours()+d.getUTCMinutes()/60;}
function hhmm(ts){const d=new Date(ts+7*36e5);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());}

/* ====== Tính toán cho từng nhân sự ====== */
function isOffDay(mp,d){const p=mp&&mp.days&&mp.days[d];if(p)return !!p.o;return dowOf(d)===0;}
function calc(m,date){const C=ST._cc||(ST._cc={}),k=m.uid+'|'+date+'|'+ST.month;return C[k]||(C[k]=calcRaw(m,date));}
function calcRaw(m,date){
  const mp=(m.plan&&m.plan.month===ST.month)?m.plan:null,dl=monthDays(ST.month),E=m.days||{},e=E[date]||null,today=ST.today;
  const c={m,mp,e,date,hasPlan:!!mp};
  c.off=isOffDay(mp,date);
  c.sub=!!(e&&e.sub>0);
  c.weeklyDay=d=>!!(mp&&mp.wk&&mp.wk.some(w=>w.src==='manual'&&d>=w.f&&d<=w.t));   // tuần SR nhập tay số tổng, không có báo cáo từng ngày
  c.status=c.off?'off':c.sub?'done':c.weeklyDay(date)?'weekly':date>today?'future':date<today?'missed':(vnHour()>=DEADLINE?'late':'wait');
  const upto=fn=>dl.reduce((s,d)=>d<=date?s+fn(d):s,0);
  const A=d=>E[d]?num(E[d].bn)+num(E[d].gd):0;
  c.dayAch=e?A(date):0;
  const dp=mp&&mp.days[date]&&!mp.days[date].o?mp.days[date]:null;
  c.dayPlan=dp?dp.si:0;c.dayVt=dp?dp.vt:0;
  c.ach=upto(A);c.unsent=0;
  if(mp&&mp.wk&&mp.wk.length){   // khớp với bảng kế hoạch theo tuần của SR
    let tot=0;
    mp.wk.forEach(w=>{if(w.f>date)return;
      const sub=dl.reduce((x,d)=>(d>=w.f&&d<=w.t&&d<=date)?x+A(d):x,0);
      if(w.src==='manual'&&w.ac)tot+=num(w.ac.bn)+num(w.ac.gd);
      else{tot+=sub;if(w.ac){const full=num(w.ac.bn)+num(w.ac.gd);if(full-sub>0.5)c.unsent+=full-sub;}}});
    c.ach=tot;
  }
  {const AG=(d,k)=>E[d]?num(E[d][k]):0;let b=upto(d=>AG(d,'bn')),g=upto(d=>AG(d,'gd'));
    if(mp&&mp.wk&&mp.wk.length){b=0;g=0;mp.wk.forEach(w=>{if(w.f>date)return;if(w.src==='manual'&&w.ac){b+=num(w.ac.bn);g+=num(w.ac.gd);}else dl.forEach(d=>{if(d>=w.f&&d<=w.t&&d<=date){b+=AG(d,'bn');g+=AG(d,'gd');}});});}
    c.achG={bn:b,gd:g};c.tg={bn:mp&&mp.target?num(mp.target.bn):0,gd:mp&&mp.target?num(mp.target.gd):0};}
  c.expected=mp?upto(d=>(mp.days[d]&&!mp.days[d].o)?mp.days[d].si:0):0;
  c.total=mp?mp.total:0;
  c.workTotal=dl.filter(d=>!isOffDay(mp,d)).length;
  c.workDone=dl.filter(d=>d<=date&&!isOffDay(mp,d)).length;
  c.workLeft=Math.max(0,c.workTotal-c.workDone);
  c.ratio=c.expected>0?c.ach/c.expected:null;
  c.pct=c.total>0?c.ach/c.total:null;
  c.expPct=c.total>0?c.expected/c.total:null;
  c.avg=c.workDone>0?c.ach/c.workDone:0;
  c.proj=c.total>0?c.avg*c.workTotal:0;
  c.projPct=c.total>0&&c.workDone>0?c.proj/c.total:null;
  c.need=c.workLeft>0?Math.max(0,c.total-c.ach)/c.workLeft:0;
  c.covN=upto(d=>E[d]?num(E[d].dp):0);
  c.cov=mp&&mp.pts>0?Math.min(1,c.covN/mp.pts):null;
  c.so=upto(d=>E[d]?num(E[d].so):0);c.htpp=upto(d=>E[d]?num(E[d].htpp):0);c.vt=upto(d=>E[d]?num(E[d].v):0);
  c.level=lvOf(c.ratio);
  // số ngày làm việc liên tiếp chưa gửi báo cáo (tính đến hôm qua hoặc đến ngày đang xem)
  const ref=date<today?date:addD(today,-1);let s=0,ever=false;
  Object.keys(E).forEach(d=>{if(E[d].sub>0)ever=true;});
  c.ever=ever;
  if(ever){for(let i=0;i<14;i++){const d=addD(ref,-i);if(isOffDay(mp,d)||c.weeklyDay(d))continue;if(E[d]&&E[d].sub>0)break;s++;}}
  c.streak=s;
  c.name=m.name||m.email.split('@')[0];
  return c;
}
function nextWork(c,date){for(let i=1;i<=8;i++){const d=addD(date,i);if(!isOffDay(c.mp,d))return d;}return addD(date,1);}

/* ====== Việc cần xử lý (xếp theo độ khẩn) ====== */
function buildFeed(list,date){const F=ST._fc||(ST._fc={}),k=date+'|'+ST.month+'|'+list.map(c=>c.m.uid).join(',');return F[k]||(F[k]=buildFeedRaw(list,date));}
function buildFeedRaw(list,date){
  const it=[],push=(c,sev,lv,ic,t,x,sug)=>it.push({uid:c.m.uid,name:c.name,sev,lv,ic,t,x,sug:sug||''});
  list.forEach(c=>{
    const n=c.name;
    if(c.e&&c.e.help)push(c,100,'bad','!',n+' cần ASM hỗ trợ',c.e.note||'SR đã đánh dấu "cần hỗ trợ" trong báo cáo ngày '+dmy(date)+'.','Gọi điện cho '+n+' để gỡ vướng: '+(c.e.note||'xem báo cáo ngày')+'.');
    if(c.streak>=2)push(c,90+Math.min(c.streak,5),'bad','⏱',n+' đã '+c.streak+' ngày làm việc chưa gửi báo cáo','Kiểm tra xem bạn ấy có đang nghỉ, hỏng điện thoại hay gặp khó khăn không.','Nhắc '+n+' gửi bù báo cáo các ngày còn thiếu trước 9h sáng mai.');
    else if(c.status==='late')push(c,80,'warn','⏰',n+' chưa gửi báo cáo (quá '+DEADLINE+'h)','Hôm nay kế hoạch '+fmt(c.dayPlan,1)+' tr, '+c.dayVt+' lượt ghé.','Nhắc '+n+' gửi báo cáo cuối ngày.');
    else if(c.status==='missed')push(c,75,'warn','⏰',n+' chưa gửi báo cáo ngày '+dmy(date),'Ngày làm việc này chưa có số liệu.','Nhắc '+n+' bổ sung báo cáo ngày '+dmy(date)+'.');
    if(c.unsent>=1)push(c,62,'warn','⇄',n+' còn '+fmt(c.unsent,1)+' tr chưa gửi báo cáo ngày','SR đã nhập số vào bảng kế hoạch nhưng chưa bấm gửi từng ngày, nên số của ASM đang thấp hơn số SR thấy.','Nhắc '+n+' bấm "Gửi tất cả" trong app để số hai bên khớp nhau.');
    if(c.ratio!=null&&c.ratio<0.7&&c.workDone>=2)push(c,70+Math.round((0.7-c.ratio)*60),'bad','▼',n+' tụt tiến độ: đạt '+pc(c.ratio)+' mốc kế hoạch','Lũy kế '+fmt(c.ach,1)+' / mốc '+fmt(c.expected,1)+' tr. Cần '+fmt(c.need,1)+' tr/ngày trong '+c.workLeft+' ngày còn lại (đang làm '+fmt(c.avg,1)+').',suggestFocus(c,date));
    else if(c.projPct!=null&&c.workDone>=3&&c.projPct<0.85&&c.ratio!=null&&c.ratio>=0.7)push(c,52,'warn','↘',n+' có nguy cơ hụt chỉ tiêu tháng','Với nhịp hiện tại dự báo chỉ đạt ~'+pc(c.projPct)+' chỉ tiêu ('+fmt(c.proj)+' / '+fmt(c.total)+' tr).',suggestFocus(c,date));
    if(c.cov!=null&&c.expPct!=null&&c.workDone>=3&&c.cov<c.expPct-0.15)push(c,55,'warn','◔',n+' độ phủ thấp: '+pc(c.cov)+' (tiến độ tháng '+pc(c.expPct)+')','Mới phủ '+c.covN+' / '+c.mp.pts+' điểm bán trên tuyến.',suggestFocus(c,date));
    (c.mp&&c.mp.alerts||[]).filter(a=>a.lv==='bad').slice(0,1).forEach(a=>push(c,40,'info','i',n+': '+a.t,a.x,''));
    if(!c.hasPlan)push(c,30,'info','i',n+' chưa lập kế hoạch tháng '+ST.month.slice(5)+'/'+ST.month.slice(0,4),'Chưa có chỉ tiêu nên chưa tính được tiến độ.','Nhắc '+n+' nhập chỉ tiêu tháng trong app.');
  });
  return it.sort((a,b)=>b.sev-a.sev);
}
/* Gợi ý trọng tâm cho ngày làm việc kế tiếp, dựa trên khoảng cách lớn nhất của từng người */
function suggestFocus(c,date){
  const nd=nextWork(c,date),p=c.mp&&c.mp.days[nd],pl=p&&!p.o?p:null;
  const L=(c.mp&&c.mp.labels)||{},nm=c.m.nganh===1?'Karofi/Livotec':'bình nước nóng/gia dụng';
  if(c.hasPlan&&c.ratio!=null&&c.ratio<0.7&&c.workLeft>0)return 'Đang đạt '+pc(c.ratio)+' mốc. Cần '+fmt(c.need,1)+' tr/ngày trong '+c.workLeft+' ngày còn lại (đang làm '+fmt(c.avg,1)+'). Ưu tiên chốt các đơn đã hẹn và chăm lại 3–5 đại lý lớn nhóm '+nm+'.';
  if(c.cov!=null&&c.expPct!=null&&c.cov<c.expPct-0.15&&c.workLeft>0){const miss=Math.max(1,Math.round(c.expPct*c.mp.pts-c.covN)),per=Math.ceil(miss/Math.max(1,c.workLeft));return 'Độ phủ mới '+pc(c.cov)+'. Mở thêm ≥ '+per+' điểm bán mới mỗi ngày (còn thiếu ~'+miss+' điểm so với tiến độ).';}
  if(c.projPct!=null&&c.projPct<0.9&&c.workLeft>0)return 'Dự báo ~'+pc(c.projPct)+' chỉ tiêu. Tăng nhịp lên '+fmt(c.need,1)+' tr/ngày: dồn lượt ghé vào nhóm đại lý có khả năng nhập thêm.';
  if(c.e&&num(c.e.so)===0&&c.sub&&num(c.e.htpp)===0)return 'Hôm nay chưa ghi nhận SO và HTPP. Ngày mai tập trung đẩy sell-out tại điểm bán đã nhập hàng.';
  return pl?'Giữ nhịp theo kế hoạch: '+fmt(pl.si,1)+' tr và '+pl.vt+' lượt ghé.':'Giữ nhịp, ưu tiên các điểm bán chưa ghé 2 tuần gần nhất.';
}


/* ====== Trợ lý AI cho ASM (gọi /api/asm/ai; máy chủ dựng prompt, ở đây chỉ gửi số liệu đã tính) ====== */
const r1=x=>Math.round(num(x)*10)/10,rp=x=>x==null?null:Math.round(x*100);
function factsOf(c,date){
  const E=c.m.days||{},e=c.e||{},L=(c.mp&&c.mp.labels)||{},ds=[];
  for(let i=6;i>=0;i--){const d=addD(date,-i);if(isOffDay(c.mp,d))continue;const x=E[d],pl=c.mp&&c.mp.days[d]&&c.mp.days[d].si;ds.push({ngay:d.slice(5),doanh_so:x&&x.sub>0?r1(num(x.bn)+num(x.gd)):null,ke_hoach:pl?r1(pl):null});}
  const grp={};if(c.e){grp[L.bn||'nhom1']=r1(e.bn);grp[L.gd||'nhom2']=r1(e.gd);}
  return{ten:c.name,nganh:c.m.nganh===1?'Ngành 1':'Ngành 2',tinh:c.m.province||'',
    bao_cao_hom_nay:{done:'đã gửi',wait:'chưa tới giờ chốt',late:'quá giờ, chưa gửi',missed:'chưa gửi',off:'ngày nghỉ',future:'chưa tới'}[c.status],
    ngay_lam_viec_chua_bao_cao_lien_tiep:c.streak,
    hom_nay:c.e?{doanh_so_theo_nhom:grp,ke_hoach:r1(c.dayPlan),HTPP:r1(e.htpp),diem_ban_moi_phu:r1(e.dp),SO:r1(e.so),luot_ghe:r1(e.v),can_ho_tro:!!e.help,ghi_chu:e.note||''}:null,
    thang:{chi_tieu:r1(c.total),luy_ke:r1(c.ach),moc_ke_hoach:r1(c.expected),dat_so_voi_moc_pct:rp(c.ratio),du_bao_cuoi_thang_pct:rp(c.projPct),can_moi_ngay:r1(c.need),dang_lam_moi_ngay:r1(c.avg),ngay_lam_viec_con_lai:c.workLeft,do_phu_pct:rp(c.cov),so_diem_ban_moi_phu:c.covN,tong_diem_ban_tren_tuyen:c.mp?c.mp.pts:0,SO:r1(c.so),HTPP:r1(c.htpp)},
    bay_ngay_gan_nhat:ds};
}
async function aiCall(task,data){
  try{const r=await api('POST','/api/asm/ai',{task,data});if(r.s===200&&r.j.ok)return r.j;return{error:r.j.error||'Trợ lý đang bận, thử lại sau.'};}
  catch(e){return{error:'Mất kết nối, thử lại sau.'};}
}
function aiLines(t){
  return String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(l=>{
    const sum=/^nhận định/i.test(l),b=/^[-•*]\s*/.test(l);
    return '<div class="ai-l'+(sum?' sum':'')+'">'+(b?'<i>•</i>':'')+'<span>'+esc(l.replace(/^[-•*]\s*/,''))+'</span></div>';
  }).join('');
}

/* ====== AI tự phân tích + cảnh báo (tự chạy khi mở trang / khi số liệu đổi; tối đa 1 lần / 10 phút) ====== */
const autoOff=()=>{try{return localStorage.getItem('asm-ai-auto')==='0';}catch(e){return false;}};
function trendPct(c,date){
  const E=c.m.days||{},d=Object.keys(E).filter(k=>k<=date&&E[k].sub>0).sort().map(k=>num(E[k].bn)+num(E[k].gd));
  if(d.length<5)return null;
  const a=d.slice(-3),b=d.slice(-7,-3),ma=a.reduce((x,y)=>x+y,0)/a.length,mb=b.reduce((x,y)=>x+y,0)/b.length;
  return mb>0?Math.round((ma/mb-1)*100):null;
}
function factsLite(c,date,id){
  const E=c.m.days||{},e=c.e||{},mx=Math.max(0,...Object.keys(E).filter(k=>k<=date&&E[k].sub>0).map(k=>num(E[k].bn)+num(E[k].gd)));
  return{id,ten:c.name,nganh:c.m.nganh,tinh:c.m.province||'',
    bc_hom_nay:{done:'đã gửi',wait:'chưa tới giờ chốt',late:'quá giờ, chưa gửi',missed:'chưa gửi',off:'nghỉ',future:''}[c.status],ngay_chua_bc_lien_tiep:c.streak,chua_gui_tr:r1(c.unsent),

    hom_nay:c.e?{ds:r1(c.dayAch),ke_hoach:r1(c.dayPlan),so:r1(e.so),diem_phu_moi:r1(e.dp),can_ho_tro:!!e.help,ghi_chu:String(e.note||'').slice(0,80)}:null};

function aiSig(all,date){

async function aiAnalyze(){

function aiAutoMaybe(){

/* ====== Xuất Excel ====== */
/* Excel có định dạng: dùng ExcelJS (SheetJS bản miễn phí không tạo được màu, viền, cố định hàng) */
let xjsP=null;
function loadExcelJS(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(!xjsP)xjsP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';sc.onload=()=>ok(window.ExcelJS);sc.onerror=()=>{xjsP=null;no(new Error('load'));};document.head.appendChild(sc);});

}
const XC={head:'FF0B4A6E',brand:'FF0A78AB',band:'FFE3F0F7',zebra:'FFF5F9FB',line:'FFD3DEE4',white:'FFFFFFFF',grey:'FF5B6B74',sun:'FFEDEFF1',
  ok:'FFD9F0E4',okT:'FF1E7F4F',warn:'FFFBEBC8',warnT:'FF955D00',bad:'FFF9DAD7',badT:'FFB3261E',info:'FFDCEBFA',infoT:'FF0B5FA5'};
const xFill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
const xBorder=()=>{const t={style:'thin',color:{argb:XC.line}};return{top:t,left:t,bottom:t,right:t};};
const xFont=o=>Object.assign({name:'Arial',size:10},o||{});
const cfStyle=(bg,fg)=>({font:{color:{argb:fg},bold:true},fill:{type:'pattern',pattern:'solid',bgColor:{argb:bg}}});
const cfLevels=(ref,b)=>{b=b||0;const t=ref.split(':')[0];return{ref,rules:[
  {type:'expression',priority:b+1,formulae:['AND(ISNUMBER('+t+'),'+t+'>=0.9)'],style:cfStyle(XC.ok,XC.okT)},
  {type:'expression',priority:b+2,formulae:['AND(ISNUMBER('+t+'),'+t+'>=0.7,'+t+'<0.9)'],style:cfStyle(XC.warn,XC.warnT)},
  {type:'expression',priority:b+3,formulae:['AND(ISNUMBER('+t+'),'+t+'<0.7)'],style:cfStyle(XC.bad,XC.badT)}]};};
const xDate=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5+25569;   // số serial ngày của Excel (chạy đúng ở mọi trình duyệt)
const cfText=(ref,list,b)=>{const t=ref.split(':')[0];return{ref,rules:list.map((x,i)=>({type:'expression',priority:(b||0)+i+1,formulae:['NOT(ISERROR(SEARCH("'+x[0]+'",'+t+')))'],style:cfStyle(x[1],x[2])}))};};
const nowVN=()=>{const d=vnNow();return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());};

/* Dựng một sheet: dòng tiêu đề lớn, dòng ghi chú, (tuỳ chọn) hàng nhóm cột, hàng tiêu đề, dữ liệu kẻ viền + kẻ sọc, cố định hàng/cột đầu, lọc, khổ in ngang. */
function xSheet(wb,o){

    pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:hr+':'+hr,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}},headerFooter:{oddFooter:'&L&8Quản lý ASM&R&8Trang &P / &N'}});
  o.widths.forEach((w,i)=>{ws.getColumn(i+1).width=w;});
  ws.mergeCells(1,1,1,n);const t=ws.getCell(1,1);t.value=o.title;t.font=xFont({size:15,bold:true,color:{argb:XC.head}});t.alignment={vertical:'middle'};ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,n);const sb=ws.getCell(2,1);sb.value=o.sub;sb.font=xFont({size:9,italic:true,color:{argb:XC.grey}});sb.alignment={vertical:'top',wrapText:true};ws.getRow(2).height=o.subH||26;

/* ====== Thực đạt so với chỉ tiêu (cả nhóm → ngành → nhóm hàng) ====== */
function attainSum(list){
  const s={n:list.length,total:0,ach:0,exp:0,proj:0,need:0,avg:0,left:0,noPlan:0};
  list.forEach(c=>{s.total+=c.total;s.ach+=c.ach;s.exp+=c.expected;s.proj+=c.proj;s.need+=c.need;s.avg+=c.avg;s.left=Math.max(s.left,c.workLeft);if(!c.hasPlan)s.noPlan++;});
  s.pct=s.total>0?s.ach/s.total:null;s.expPct=s.total>0?s.exp/s.total:null;s.ratio=s.exp>0?s.ach/s.exp:null;s.projPct=s.total>0?s.proj/s.total:null;
  return s;
}
function attainGroup(list,k){
  const g={total:0,ach:0,proj:0};
  list.forEach(c=>{g.total+=c.tg[k];g.ach+=c.achG[k];if(c.workDone>0)g.proj+=c.achG[k]/c.workDone*c.workTotal;});
  g.pct=g.total>0?g.ach/g.total:null;g.projPct=g.total>0?g.proj/g.total:null;
  return g;
}

  const row=(label,s,o)=>{
    const lvl=o.lvl&&s.ratio!=null?lvOf(s.ratio):'',w=Math.max(0,Math.min(100,(s.pct||0)*100)).toFixed(1);

      '<td class="r hm">'+fmt(Math.max(0,s.total-s.ach),1)+'</td><td class="r hm">'+(s.projPct!=null?pc(s.projPct):'–')+'</td></tr>';

    const L=all.filter(c=>c.m.nganh===k),S=attainSum(L),lb=t.byNg[k]?t.byNg[k].lb:{bn:'',gd:''};
    rows.push(row(NG[k].n+' <span class="muted tiny hm">· '+S.n+' người</span>',S,{mk:1,lvl:1}));

  });

  return head+sum+'<div class="tblwrap"><table class="t attt"><thead><tr><th>Phạm vi</th><th class="r">Chỉ tiêu<span class="hm"> (tr)</span></th><th class="r">Thực đạt<span class="hm"> (tr)</span></th><th>Tiến độ <span class="hm">(vạch đen = mốc hôm nay)</span></th><th class="r hm">Còn thiếu (tr)</th><th class="r hm">Dự báo cuối tháng</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div></div>';
}

function members(){
  const d=ST.data;if(!d)return[];
  return d.members.filter(m=>!ST.ng||m.nganh===ST.ng);
}
function team(list){
  const t={n:list.length,work:0,done:0,dayAch:0,dayPlan:0,ach:0,exp:0,total:0,so:0,htpp:0,dp:0,pts:0,covN:0,bn:0,gd:0,help:0,byNg:{1:{n:0,ach:0,total:0,day:0,bn:0,gd:0,lb:{bn:'',gd:''}},2:{n:0,ach:0,total:0,day:0,bn:0,gd:0,lb:{bn:'',gd:''}}}};
  list.forEach(c=>{
    if(!c.off&&c.status!=='weekly'){t.work++;if(c.sub)t.done++;}
    t.dayAch+=c.dayAch;t.dayPlan+=c.dayPlan;t.ach+=c.ach;t.exp+=c.expected;t.total+=c.total;
    t.so+=c.e?num(c.e.so):0;t.htpp+=c.e?num(c.e.htpp):0;t.dp+=c.e?num(c.e.dp):0;
    if(c.mp){t.pts+=c.mp.pts;t.covN+=c.covN;}
    if(c.e&&c.e.help)t.help++;
    const g=t.byNg[c.m.nganh];if(g){g.n++;g.ach+=c.ach;g.total+=c.total;g.day+=c.dayAch;if(c.e){g.bn+=num(c.e.bn);g.gd+=num(c.e.gd);}if(c.mp){g.lb.bn=g.lb.bn||c.mp.labels.bn;g.lb.gd=g.lb.gd||c.mp.labels.gd;}}
  });
  t.ratio=t.exp>0?t.ach/t.exp:null;t.pct=t.total>0?t.ach/t.total:null;t.expPct=t.total>0?t.exp/t.total:null;
  t.cov=t.pts>0?Math.min(1,t.covN/t.pts):null;
  return t;
}

function ring(p,size,col,txt){
  const r=size/2-5,C=2*Math.PI*r,v=Math.max(0,Math.min(1,p==null?0:p));
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="6"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(col||'#fff')+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(C*v).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="'+Math.round(size*.26)+'" font-weight="700">'+(txt==null?pc(p):txt)+'</text></svg>';
}
function spark(c,date){
  const days=[];for(let i=13;i>=0;i--)days.push(addD(date,-i));
  const E=c.m.days||{},mx=Math.max(1,...days.map(d=>Math.max(E[d]?num(E[d].bn)+num(E[d].gd):0,(c.mp&&c.mp.days[d]&&c.mp.days[d].si)||0)));
  const w=7,gap=3,h=30;
  const bars=days.map((d,i)=>{
    const x=i*(w+gap),off=isOffDay(c.mp,d),e=E[d],v=e?num(e.bn)+num(e.gd):0,pl=(c.mp&&c.mp.days[d]&&c.mp.days[d].si)||0;
    if(off)return '<rect x="'+x+'" y="'+(h-2)+'" width="'+w+'" height="2" rx="1" fill="var(--line)"/>';
    if(c.weeklyDay(d)&&!e)return '<rect x="'+x+'" y="'+(h-4)+'" width="'+w+'" height="4" rx="2" fill="var(--n1)" opacity=".35"><title>'+dmy(d)+': số nhập theo tuần</title></rect>';
    if(d>ST.today)return '<rect x="'+x+'" y="'+(h-2)+'" width="'+w+'" height="2" rx="1" fill="var(--line)" opacity=".5"/>';
    if(!e||!(e.sub>0))return '<rect x="'+x+'" y="'+(h-6)+'" width="'+w+'" height="6" rx="2" fill="none" stroke="var(--bad)" stroke-width="1" stroke-dasharray="2 2"/>';
    const hh=Math.max(3,v/mx*(h-2)),r=pl>0?v/pl:null,col=r==null?'var(--brand)':r>=.9?'#2E9D68':r>=.7?'#E3A63B':'#D8473E';
    return '<rect x="'+x+'" y="'+(h-hh)+'" width="'+w+'" height="'+hh+'" rx="2" fill="'+col+'"><title>'+dmy(d)+': '+fmt(v,1)+' tr</title></rect>';
  }).join('');
  return '<svg width="'+(14*(w+gap)-gap)+'" height="'+h+'" viewBox="0 0 '+(14*(w+gap)-gap)+' '+h+'" role="img" aria-label="Doanh số 14 ngày gần nhất">'+bars+'</svg>';
}
function lineChart(plan,act,todayIdx,w,h){
  const n=plan.length,mx=Math.max(1,...plan,...act.filter(v=>v!=null));
  const X=i=>(n>1?i/(n-1):0)*(w-34)+28,Y=v=>h-18-(v/mx)*(h-34);
  const pp=plan.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');

    (ap.length?'<polyline points="'+ap.join(' ')+'" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>':'')+xl+'</svg>';
}

    :'<div class="note">Chưa lập kế hoạch tháng '+ST.month.slice(5)+'/'+ST.month.slice(0,4)+'.</div>';

const isCall=c=>!!((c.e&&c.e.help)||c.streak>=2||c.level==='bad');   // việc ASM nên gọi điện ngay
function filterList(list){
  let l=list.slice();
  if(ST.q){const q=ST.q.toLowerCase();l=l.filter(c=>(c.name+' '+c.m.email+' '+(c.m.province||'')).toLowerCase().includes(q));}
  if(ST.flt==='todo')l=l.filter(c=>!c.off&&!c.sub);
  else if(ST.flt==='call')l=l.filter(isCall);
  else if(ST.flt==='help')l=l.filter(c=>c.e&&c.e.help);
  else if(ST.flt==='behind')l=l.filter(c=>c.level==='bad'||c.level==='warn');
  const rk={risk:c=>(c.e&&c.e.help?-3:0)+(c.status==='late'||c.status==='missed'?-2:0)+(c.ratio==null?0.5:c.ratio),prog:c=>-(c.pct==null?-1:c.pct),name:c=>c.name};
  const f=rk[ST.sort]||rk.risk;
  l.sort((a,b)=>{const x=f(a),y=f(b);return typeof x==='string'?x.localeCompare(y,'vi'):x-y;});
  return l;
}

function monthRep(c){const E=c.m.days||{};return Object.keys(E).some(d=>d.slice(0,7)===ST.month&&E[d].sub>0);}
function cellState(c,d){
  const E=c.m.days||{},e=E[d],late=vnHour()>=DEADLINE,pl=c.mp&&c.mp.days[d]&&!c.mp.days[d].o?c.mp.days[d].si:0,v=e?num(e.bn)+num(e.gd):0;
  const o={d,v,pl,cls:'',txt:'',tip:dmy(d),req:0,got:0,help:false,sent:e&&e.sub>0?e.sub:0};
  if(isOffDay(c.mp,d)){o.cls='off';o.txt='·';o.tip+=' · nghỉ';}
  else if(e&&e.sub>0){const r=pl>0?v/pl:null;o.r=r;o.cls=r==null?'nodata':r>=.9?'ok':r>=.7?'warn':'bad';o.txt=fmt(v);o.got=1;o.req=1;o.help=!!e.help;o.tip+=': '+fmt(v,1)+' tr'+(pl?' / kế hoạch '+fmt(pl,1)+' tr ('+pc(r)+')':'')+(e.help?' · CẦN HỖ TRỢ':'');}
  else if(c.weeklyDay(d)){o.cls='nodata';o.txt='T';o.weekly=1;o.tip+=' · số nhập theo tuần (không có báo cáo từng ngày)';}
  else if(d>ST.today){o.cls='future';o.tip+=' · chưa tới';}
  else if(!c.hasPlan&&!monthRep(c)){o.cls='nodata';o.txt='–';o.noplan=1;o.tip+=' · chưa lập kế hoạch và chưa có báo cáo nào';}
  else if(d===ST.today&&!late){o.cls='wait';o.txt='…';o.tip+=' · chưa tới giờ chốt báo cáo ('+DEADLINE+'h)';}
  else{o.cls='miss';o.txt='!';o.req=1;o.tip+=' · quá hạn, chưa gửi báo cáo';}
  return o;
}
function dayStats(list,d){
  const s={d,act:0,plan:0,sent:0,need:0,pend:0};
  list.forEach(c=>{const x=cellState(c,d);if(x.cls==='off')return;s.plan+=x.pl;if(x.got){s.act+=x.v;s.sent++;}if(x.req)s.need++;if(x.cls==='wait')s.pend++;});
  s.exp=s.need+s.pend;s.r=s.plan>0&&s.act>0?s.act/s.plan:null;
  return s;
}
function weeksOf(dl){const W=[];let cur=null;dl.forEach(d=>{if(!cur||dowOf(d)===1){cur=[];W.push(cur);}cur.push(d);});return W;}
function heatDay(dl){
  const last=dl.filter(d=>d<=ST.today).pop()||dl[0];let d=ST.hd;
  if(!d||d.slice(0,7)!==ST.month||d>ST.today)d=(ST.date.slice(0,7)===ST.month&&ST.date<=ST.today)?ST.date:last;
  return d;
}
const toneCol=r=>r==null?'#6B8FA3':r>=.9?'#2E9D68':r>=.7?'#E3A63B':'#D8473E';
function dayChart(all,dl,sel){
  const nw=isNarrow(700),W=nw?340:900,H=nw?190:220,pl=nw?30:44,pr=6,pt=10,pb=34,n=dl.length,sl=(W-pl-pr)/n,bw=Math.max(5,sl*0.62);
  const st=dl.map(d=>dayStats(all,d)),mx0=Math.max(1,...st.map(s=>Math.max(s.act,s.plan))),mx=mx0*1.08,ih=H-pt-pb,Y=v=>pt+ih*(1-v/mx);
  let g='';
  [0,.5,1].forEach(f=>{const v=mx0*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="'+(f?'3 3':'0')+'"/><text x="'+(pl-5)+'" y="'+(Y(v)+3.5).toFixed(1)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+fmt(v)+'</text>';});
  dl.forEach((d,i)=>{
    const s=st[i],x=pl+i*sl,cx=x+sl/2,isSel=d===sel,isT=d===ST.today;
    if(isSel)g+='<rect x="'+x.toFixed(1)+'" y="'+(pt-4)+'" width="'+sl.toFixed(1)+'" height="'+(H-pt-pb+8+14)+'" rx="5" fill="var(--brand)" opacity=".13"/>';
    if(s.act>0){const h=Math.max(2,ih*s.act/mx);g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(Y(s.act)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2.5" fill="'+toneCol(s.r)+'"/>';}
    if(s.plan>0)g+='<line x1="'+(cx-bw/2-1.5).toFixed(1)+'" x2="'+(cx+bw/2+1.5).toFixed(1)+'" y1="'+Y(s.plan).toFixed(1)+'" y2="'+Y(s.plan).toFixed(1)+'" stroke="var(--ink)" stroke-width="1.8" opacity=".75"/>';
    let dc='';if(s.exp>0){dc=s.sent>=s.exp?'#2E9D68':s.sent===0?(d===ST.today&&s.pend?'var(--line)':'#D8473E'):'#E3A63B';}
    if(dc)g+='<circle cx="'+cx.toFixed(1)+'" cy="'+(H-pb+9)+'" r="'+(nw?2.4:3)+'" fill="'+dc+'"/>';
    if(!nw||dowOf(d)===1||i===0||i===n-1||isSel||isT)g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" font-size="'+(nw?10:11)+'" text-anchor="middle" fill="'+(isT?'var(--brand-deep)':dowOf(d)===0?'var(--bad)':'var(--muted)')+'" font-weight="'+(isT||isSel?700:500)+'">'+(+d.slice(8))+'</text>';
  });
  dl.forEach((d,i)=>{const s=st[i];g+='<rect x="'+(pl+i*sl).toFixed(1)+'" y="0" width="'+sl.toFixed(1)+'" height="'+H+'" fill="transparent" data-act="hday" data-d="'+d+'" tabindex="0" role="button" aria-label="Ngày '+dmy(d)+(s.exp?': đã gửi '+s.sent+'/'+s.exp+' người':'')+(s.act?', doanh số '+fmt(s.act,1)+' triệu':'')+'" style="cursor:pointer"/>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Doanh số cả nhóm theo từng ngày" style="max-height:'+H+'px;touch-action:manipulation">'+g+'</svg>';
}

/* ====== Kênh gửi: email (qua máy chủ) và Zalo (mở khung chat + sao chép tin) ====== */
function zpGet(){try{return JSON.parse(localStorage.getItem('asm-zalo')||'{}')||{};}catch(e){return{};}}
function zpSet(uid,v){try{const z=zpGet();if(String(v).trim())z[uid]=String(v).trim();else delete z[uid];localStorage.setItem('asm-zalo',JSON.stringify(z));}catch(e){}}
const mailPref=()=>{try{return localStorage.getItem('asm-mail')==='1';}catch(e){return false;}};
function normPhone(v){let p=String(v||'').replace(/[\s.\-()]/g,'');if(p.indexOf('+84')===0)p='0'+p.slice(3);else if(/^84\d{9,10}$/.test(p))p='0'+p.slice(2);return /^0\d{9,10}$/.test(p)?p:'';}
function composeRecips(C){const mem=ST.data.members;if(C.uids&&C.uids.length)return mem.filter(x=>C.uids.indexOf(x.uid)>=0);if(C.uid)return mem.filter(x=>x.uid===C.uid);return mem.filter(x=>!C.nganh||x.nganh===C.nganh);}
function zaloMsg(C,m){const nm=String(m.name||m.email.split('@')[0]).trim().split(/\s+/).pop(),txt=($('#ctext')?$('#ctext').value:C.text).trim();return 'Chào '+nm+', '+txt+(ST.data.me.name?' — ASM '+ST.data.me.name:'');}
function fallbackCopy(t,cb){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){toast('Không sao chép được, hãy tự chọn và sao chép nội dung.');}ta.remove();}
function openZalo(uid){
  const C=ST.compose,m=ST.data.members.find(x=>x.uid===uid);if(!C||!m)return;
  const inp=document.getElementById('zp_'+uid),ph=normPhone(inp?inp.value:zpGet()[uid]);
  if(!ph){toast('Nhập số Zalo hợp lệ của '+(m.name||m.email)+' (10–11 số, bắt đầu bằng 0).',3400);if(inp)inp.focus();return;}
  zpSet(uid,ph);const msg=zaloMsg(C,m),done=()=>toast('Đã sao chép tin nhắn. Dán vào ô chat Zalo rồi gửi nhé!',3800);
  let p=null;try{if(navigator.clipboard&&navigator.clipboard.writeText)p=navigator.clipboard.writeText(msg);}catch(e){}   // sao chép trước khi mở tab mới
  window.open('https://zalo.me/'+ph,'_blank','noopener');
  if(p)p.then(done,()=>fallbackCopy(msg,done));else fallbackCopy(msg,done);
}

    '<div class="tiny muted" style="margin-top:5px">'+(C.email?'Email gửi tới địa chỉ email công ty của <b>'+rc.length+'</b> người, tối đa 60 email/ngày. Họ trả lời ASM qua email này.':'Trong app luôn gửi. Bật thêm email hoặc Zalo nếu cần nhắc chắc chắn hơn.')+'</div></div>';

  return h;
}

async function nmCreate(){
  const N=ST.nm;if(!N||N.busy)return;nmSync();
  if(!emailOk(N.email.trim())){N.err='Nhập email hợp lệ.';render();return;}
  if(!N.name.trim()){N.err='Hãy nhập họ tên.';render();return;}
  if(N.pw&&N.pw.length<8){N.err='Mật khẩu tạm cần ít nhất 8 ký tự (hoặc để trống).';render();return;}
  N.busy=true;N.err='';render();
  const body={op:'createMember',role:N.role,email:N.email.trim(),name:N.name.trim(),password:N.pw||''};
  if(N.role==='sr'){body.nganh=N.nganh;body.asmEmail=N.asm;body.province=N.province;}
  else{body.nganhs=[N.n1?1:null,N.n2?2:null].filter(Boolean);body.provinces=N.provs;if(!body.nganhs.length){N.busy=false;N.err='Chọn ít nhất một ngành.';render();return;}}
  const r=await api('POST','/api/org',body);N.busy=false;
  if(r.s===200){N.done={email:body.email,name:body.name,role:N.role,created:!!r.j.created,tempPassword:r.j.tempPassword||''};render();await loadOrg();await loadData(true);}
  else{N.err=(r.j&&r.j.error)||'Không tạo được thành viên.';render();}
}
/* ====== Tab Nhân sự: quản lý theo từng thành viên (bảng gọn, lọc, sắp xếp, thao tác ngay trên dòng) ====== */
function staffRows(big){
  const date=ST.date,S=ST.ms||(ST.ms={q:'',f:'all',k:'risk',d:1}),since=addD(ST.today,-6);
  const src=big?((ST.sd&&ST.sd.members)||[]):members();
  const rows=src.map(m=>{
    const c=calc(m,date),E=m.days||{};let last='';Object.keys(E).forEach(d=>{if(E[d].sub>0&&d>last)last=d;});
    const it=(m.dir||[]).filter(x=>x.date>=since);
    return{c,last,dt:it.length,dd:it.filter(x=>x.done).length};
  });
  const pass={all:()=>true,todo:r=>!r.c.off&&!r.c.sub&&r.c.status!=='weekly'&&r.c.status!=='future',debt:r=>r.c.streak>=1,help:r=>!!(r.c.e&&r.c.e.help),behind:r=>r.c.level==='bad'||r.c.level==='warn',noplan:r=>!r.c.hasPlan};
  const q=(S.q||'').toLowerCase();
  const risk=r=>(r.c.e&&r.c.e.help?-3:0)+(r.c.status==='late'||r.c.status==='missed'?-2:0)+(r.c.ratio==null?0.5:r.c.ratio);
  const num2=(x,d)=>x==null?d:x;
  const cmp={risk:(a,b)=>risk(a)-risk(b),name:(a,b)=>a.c.name.localeCompare(b.c.name,'vi'),ng:(a,b)=>a.c.m.nganh-b.c.m.nganh||a.c.name.localeCompare(b.c.name,'vi'),
    pct:(a,b)=>num2(a.c.pct,-1)-num2(b.c.pct,-1),ratio:(a,b)=>num2(a.c.ratio,9)-num2(b.c.ratio,9),debt:(a,b)=>a.c.streak-b.c.streak,last:(a,b)=>(a.last||'').localeCompare(b.last||'')};
  const all=rows.slice(),cnt={};Object.keys(pass).forEach(k=>{cnt[k]=all.filter(pass[k]).length;});
  const list=big?all:all.filter(pass[S.f]||pass.all).filter(r=>!q||(r.c.name+' '+r.c.m.email+' '+(r.c.m.province||'')).toLowerCase().includes(q)).sort((a,b)=>(cmp[S.k]||cmp.risk)(a,b)*(S.d||1));
  return{list,cnt,total:big?(ST.sd?ST.sd.total:0):all.length};
}

/* ====== Nhập từ file Excel nhân sự (đọc ngay trong trình duyệt; chỉ gửi tên, email công ty, ngành, ASM, tỉnh) ====== */
const strip=t=>String(t==null?'':t).normalize('NFC').replace(/\s+/g,' ').trim();
const nkey=t=>strip(t).toLowerCase();
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function sheetRows(wb,X,name){const ws=wb.Sheets[name];return ws?X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}):null;}
function tableOf(rows,must){
  for(let i=0;i<Math.min(rows.length,15);i++){const h=rows[i].map(nkey);if(must.every(m=>h.indexOf(nkey(m))>=0)){const idx={};h.forEach((x,j)=>{if(x&&idx[x]===undefined)idx[x]=j;});return{idx,data:rows.slice(i+1)};}}
  return null;
}
const cellOf=(r,t,name)=>{const j=t.idx[nkey(name)];return j===undefined?'':strip(r[j]);};
const splitProv=t=>strip(t).split(/[,+;\n]/).map(x=>strip(x.replace(/^1\/2\s*/,''))).filter(Boolean);
function parseRoster(wb,X){
  const out={asms:[],members:[],issues:[],stats:{},error:''};
  const need={'ASM GT1':['Họ và tên','Chức vụ','Provices','Email'],'ASM GT2':['Họ và tên đầy đủ','Chức danh','Email công ty','Các tỉnh phụ trách'],'GT1':['Họ và tên đầy đủ','Chức danh','Quản lý trực tiếp','Email công ty'],'GT2':['Họ và tên đầy đủ','Chức danh','Quản lý trực tiếp','Email công ty']};
  const T={};
  for(const k of Object.keys(need)){const rows=sheetRows(wb,X,k);if(!rows){out.error='Không thấy sheet "'+k+'" trong file.';return out;}T[k]=tableOf(rows,need[k]);if(!T[k]){out.error='Sheet "'+k+'" thiếu cột cần thiết ('+need[k].join(', ')+').';return out;}}
  const asmMap={},names={1:{},2:{}};
  const addAsm=(email,name,ng,prov)=>{const a=asmMap[email]||(asmMap[email]={email,name,nganh:[],provinces:[]});if(a.nganh.indexOf(ng)<0)a.nganh.push(ng);prov.forEach(x=>{if(!a.provinces.some(y=>nkey(y)===nkey(x)))a.provinces.push(x);});};
  // ASM ngành 1
  T['ASM GT1'].data.forEach(r=>{const name=cellOf(r,T['ASM GT1'],'Họ và tên');if(!name)return;const role=cellOf(r,T['ASM GT1'],'Chức vụ'),email=cellOf(r,T['ASM GT1'],'Email').toLowerCase(),isAsm=/asm/i.test(role);
    names[1][nkey(name)]={email,role:isAsm?'asm':'senior',title:role};
    if(isAsm){if(emailOk(email))addAsm(email,name,1,splitProv(cellOf(r,T['ASM GT1'],'Provices')));else out.issues.push({ten:name,ng:1,ly:'ASM thiếu email công ty'});}});
  // ASM ngành 2 (một người có thể nằm nhiều dòng theo khu vực: gộp theo MSNV)
  const g2={};
  T['ASM GT2'].data.forEach(r=>{const name=cellOf(r,T['ASM GT2'],'Họ và tên đầy đủ');if(!name)return;const key=cellOf(r,T['ASM GT2'],'MSNV mới')||nkey(name),g=g2[key]||(g2[key]={name,email:'',prov:[]});
    const em=cellOf(r,T['ASM GT2'],'Email công ty').toLowerCase();if(em&&!g.email)g.email=em;splitProv(cellOf(r,T['ASM GT2'],'Các tỉnh phụ trách')).forEach(x=>g.prov.push(x));});
  Object.keys(g2).forEach(k=>{const g=g2[k];names[2][nkey(g.name)]={email:g.email,role:'asm',title:'ASM'};if(emailOk(g.email))addAsm(g.email,g.name,2,g.prov);else out.issues.push({ten:g.name,ng:2,ly:'ASM thiếu email công ty'});});
  out.asms=Object.keys(asmMap).map(k=>asmMap[k]);
  // Nhân viên bán hàng (bỏ AQUALINK, người đã thôi việc, và các chức danh không phải Đại diện Bán hàng)
  const seen={},st={bo_chuc_danh:0,bo_aqualink:0,bo_thoi_viec:0};
  [['GT1',1],['GT2',2]].forEach(([sh,ng])=>{const t=T[sh];t.data.forEach(r=>{
    const name=cellOf(r,t,'Họ và tên đầy đủ');if(!name)return;
    if(!/^đại diện bán hàng/.test(nkey(cellOf(r,t,'Chức danh')))){st.bo_chuc_danh++;return;}
    if(/aqualink/i.test(cellOf(r,t,'Đơn vị thành viên'))){st.bo_aqualink++;return;}
    if(cellOf(r,t,'Ngày thôi việc')){st.bo_thoi_viec++;return;}
    const email=cellOf(r,t,'Email công ty').toLowerCase();
    if(!emailOk(email)){out.issues.push({ten:name,ng,ly:'thiếu email công ty (chưa thể đăng nhập)'});return;}
    if(seen[email])return;seen[email]=1;
    const mgr=strip(cellOf(r,t,'Quản lý trực tiếp').replace(/^[^-]*-/,'')),hit=names[ng][nkey(mgr)]||names[3-ng][nkey(mgr)];
    let asmEmail='';
    if(!mgr)out.issues.push({ten:name,ng,ly:'chưa có quản lý trực tiếp'});
    else if(!hit)out.issues.push({ten:name,ng,ly:'quản lý "'+mgr+'" không có trong danh sách ASM'});
    else if(hit.role!=='asm')out.issues.push({ten:name,ng,ly:'quản lý "'+mgr+'" là '+hit.title+', chưa phải ASM'});
    else if(!emailOk(hit.email))out.issues.push({ten:name,ng,ly:'ASM "'+mgr+'" thiếu email nên chưa gán được'});
    else asmEmail=hit.email;
    out.members.push({email,name,nganh:ng,asmEmail});});});
  out.stats=Object.assign(st,{asm:out.asms.length,sr:out.members.length,co_asm:out.members.filter(m=>m.asmEmail).length,sr1:out.members.filter(m=>m.nganh===1).length,sr2:out.members.filter(m=>m.nganh===2).length});
  return out;
}

  if(!xlsxP)xlsxP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>{xlsxP=null;no(new Error('load'));};document.head.appendChild(sc);});

}

      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="flex:2" data-act="impGo"'+(I.busy?' disabled':'')+'>'+(I.busy?'Đang nhập '+(I.prog||'')+'…':'Nhập '+s.asm+' ASM và '+s.sr+' nhân viên')+'</button><button class="btn ghost" style="flex:1" data-act="impReset">Huỷ</button></div><div class="tiny muted" style="margin-top:6px">Nhân viên chưa có tài khoản sẽ tự có ngành + ASM (khoá) khi đăng nhập app lần đầu. Có thể nhập lại nhiều lần, dữ liệu cũ được cập nhật chứ không nhân đôi.</div>';}
  return '<div class="card"><h2>Nhập từ file Excel nhân sự</h2><div class="hsub">Chọn file danh sách nhân sự (có các sheet GT1, GT2, ASM GT1, ASM GT2). File được đọc ngay trên máy bạn; chỉ gửi lên tên, email công ty, ngành, ASM phụ trách và tỉnh/thành. Số điện thoại, địa chỉ, ngày sinh, email cá nhân <b>không</b> được gửi đi.</div>'+body+'</div>';

async function pgCall(op,extra){

}
async function pgPrev(){

}
async function pgBackup(){
  const r=await pgCall('purgeBackup');

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r.j.backup,null,1)],{type:'application/json'}));a.download='sao-luu-truoc-khi-xoa-'+ST.today+'.json';document.body.appendChild(a);a.click();a.remove();toast('Đã tải bản sao lưu ('+r.j.backup.users.length+' tài khoản).',3000);

async function pgRun(){
  const G=ST.pg;if(!G.prev||G.confirm!=='XOA HET'||G.busy)return;
  G.busy=true;G.err='';render();

}

async function lforgot(){

async function lsubmit(){
  const L=ST.login;if(L.busy)return;
  L.email=($('#lEmail')?$('#lEmail').value:L.email).trim().toLowerCase();
  if($('#lName'))L.name=$('#lName').value.trim();
  const pass=$('#lPass')?$('#lPass').value:L.pass,otp=$('#lOtp')?$('#lOtp').value.trim():'';
  if($('#lPass'))L.pass=pass;
  if(!L.email||!pass){L.msg='Nhập email và mật khẩu.';render();return;}
  L.busy=true;L.msg='';render();
  try{
    const r=await api('POST','/api/auth/request',{email:L.email,password:pass,name:L.name,otp:otp||undefined});
    if(r.j.needsOtp){L.otp=true;L.msg='Đã gửi mã xác minh tới email của bạn.';}
    else if(r.j.token){setToken(r.j.token);L.pass='';L.otp=false;L.busy=false;await boot();return;}
    else L.msg=r.j.error||'Không đăng nhập được.';
  }catch(e){L.msg='Không kết nối được máy chủ.';}
  L.busy=false;render();
}

/* ====== Tải dữ liệu & vòng đời ====== */
async function loadData(silent){
  if(ST.loading)return;ST.loading=true;
  try{
    const r=await api('GET','/api/team?month='+encodeURIComponent(ST.month||'')+(ST.asm?'&asm='+encodeURIComponent(ST.asm):''));
    if(r.s===401){setToken('');ST.boot='login';}
    else if(r.s===403){ST.boot='denied';}
    else if(r.s===200){
      ST.data=r.j;ST._cc=null;ST._fc=null;ST.skew=r.j.now-Date.now();ST.today=r.j.today;ST.loadedAt=r.j.now;
      if(!ST.month)ST.month=r.j.month;
      if(!ST.date)ST.date=ST.today;
      ST.boot='ready';ST.err='';
    }else{ST.err=r.j.error||'Không tải được dữ liệu.';if(!ST.data)ST.boot='error';}
  }catch(e){ST.err='Mất kết nối. Đang thử lại…';if(!ST.data)ST.boot='error';}
  ST.loading=false;
  if(!silent||ST.boot!=='ready')render();else softRender();
}
function softRender(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;if(ST.compose||ST.mm||ST.nm)return;render();}
async function boot(){
  ST.boot='loading';render();
  try{
    const r=await api('GET','/api/auth/me');
    if(r.s!==200||!r.j.avail){ST.boot='error';ST.err='Đăng nhập chưa được cấu hình trên máy chủ.';render();return;}
    if(!r.j.loggedIn){ST.boot='login';render();return;}
    if(!r.j.isAdmin&&!r.j.isAsm){ST.boot='denied';ST.who=r.j.email||'';render();return;}
    await loadData();
  }catch(e){ST.boot='error';ST.err='Không kết nối được máy chủ.';render();}
}

function openCompose(o){ST.compose=Object.assign({email:mailPref(),zalo:false,uid:'',uids:null,nganh:0,kind:'focus',date:addD(ST.today,1),text:'',msg:'',busy:false},o);render();}
async function sendCompose(){
  const C=ST.compose;if(C.busy)return;
  C.text=$('#ctext').value.trim();
  if(C.text.length<2){C.msg='Hãy nhập nội dung việc cần giao.';render();return;}
  C.busy=true;C.msg='';render();
  const body={op:'send',text:C.text,date:C.date,kind:C.kind,email:!!C.email};
  if(C.uids&&C.uids.length)body.to=C.uids;else if(C.uid)body.to=[C.uid];else{body.to='all';if(C.nganh)body.nganh=C.nganh;}
  const r=await api('POST','/api/directive',body);
  if(r.s===200){ST.compose=null;if(C.uids)ST.sel={};const em=r.j.email;let ex='';if(em)ex=!em.configured?' · Email chưa gửi được: máy chủ chưa cấu hình SMTP':' · Email: đã gửi '+em.sent+(em.skipped?', bỏ qua '+em.skipped:'')+(em.failed?', lỗi '+em.failed:'');toast('Đã giao việc cho '+r.j.sent+' người'+ex,em?5200:2400);await loadData(true);}
  else{C.busy=false;C.msg=r.j.error||'Không gửi được.';render();}
}
async function sendPlan(){
  if(ST.sending)return;
  const date=ST.date,list=filterList(members().map(m=>calc(m,date))).filter(c=>ST.nsel[c.m.uid]!==false);
  ST.sending=true;render();let ok=0,fail=0;
  await Promise.all(list.map(async c=>{
    const text=(ST.ndraft[c.m.uid]!=null?ST.ndraft[c.m.uid]:suggestFocus(c,date)).trim();
    if(text.length<2){fail++;return;}
    const r=await api('POST','/api/directive',{op:'send',to:[c.m.uid],text,date:nextWork(c,date),kind:'focus'});

  }));
  ST.sending=false;ST.ndraft={};
  toast('Đã gửi trọng tâm cho '+ok+' người'+(fail?' · '+fail+' lỗi':''));

  else if(a==='rmMember'){if(confirm('Gỡ '+d.name+' khỏi nhóm của bạn?\n\nTài khoản và số liệu vẫn được giữ. Bạn ấy sẽ không tự chọn lại ASM này được.')){api('POST','/api/team',{op:'removeMember',uid:d.uid}).then(async r=>{if(r.s===200){ST.drawer=null;toast('Đã gỡ '+d.name+' khỏi nhóm');await loadData(true);render();}else toast((r.j&&r.j.error)||'Không gỡ được.',3000);});}return;}
  else if(a==='aiBrief'){aiBrief();return;}
  else if(a==='aiPlan'){aiPlan();return;}
  else if(a==='aiCoach'){aiCoach(d.uid);return;}
  else if(a==='aiCompose'){aiCompose();return;}
  else if(a==='ltab'){ST.login.tab=d.v;ST.login.msg='';if($('#lEmail'))ST.login.email=$('#lEmail').value;}
  else if(a==='lsubmit'){lsubmit();return;}
  else if(a==='lforgot'){lforgot();return;}
  else if(a==='lcancel'){ST.login.otp=false;ST.login.msg='';}
  else if(a==='oaNg'){const F0=ST.of;if($('#oaEmail')){F0.email=$('#oaEmail').value;F0.name=$('#oaName').value;F0.prov=$('#oaProv').value;}ST.of[d.v==='1'?'n1':'n2']=!ST.of[d.v==='1'?'n1':'n2'];}
  else if(a==='editAsm'){const x=ST.org.asms.find(z=>z.email===d.email);if(x){const ng=x.nganh&&x.nganh.length?x.nganh:[1,2];ST.of={email:x.email,name:x.name||'',n1:ng.indexOf(1)>=0,n2:ng.indexOf(2)>=0,prov:(x.provinces||[]).join(', ')};}}
  else if(a==='addAsm'){const F=ST.of;F.email=$('#oaEmail').value.trim();F.name=$('#oaName').value;F.prov=$('#oaProv').value;if(!F.n1&&!F.n2){ST.orgErr='Chọn ít nhất một ngành.';render();return;}orgCall({op:'addAsm',email:F.email,name:F.name,nganh:[F.n1?1:null,F.n2?2:null].filter(Boolean),provinces:F.prov},'Đã lưu ASM').then(r=>{if(r&&r.s===200)ST.of=null;render();});return;}
  else if(a==='mgmt'){ST.mm={uid:d.uid,err:''};}
  else if(a==='mmClose'){if(b.classList.contains('scrim')&&e.target!==b)return;ST.mm=null;}
  else if(a==='mmSave'){mmCall({op:'editMember',uid:ST.mm.uid,name:$('#mmName').value,province:$('#mmProv').value},'Đã lưu thông tin');return;}
  else if(a==='mmPw'){const pw=$('#mmPw').value;if(pw.length<8){ST.mm.err='Mật khẩu cần ít nhất 8 ký tự.';render();return;}mmCall({op:'setPassword',uid:ST.mm.uid,password:pw},'Đã đặt mật khẩu mới');return;}
  else if(a==='mmDis'){mmCall({op:'setDisabled',uid:ST.mm.uid,disabled:d.v==='1'},d.v==='1'?'Đã khoá tài khoản':'Đã mở khoá');return;}
  else if(a==='mmOut'){if(confirm('Đăng xuất người này khỏi mọi thiết bị?'))mmCall({op:'signOut',uid:ST.mm.uid},'Đã đăng xuất mọi thiết bị');return;}
  else if(a==='mmDel'){const x=mmFind(ST.mm.uid);if(x&&confirm('XOÁ VĨNH VIỄN tài khoản '+x.email+'?\n\nToàn bộ số liệu của người này trên máy chủ sẽ mất, không khôi phục được.'))mmCall({op:'deleteMember',uid:ST.mm.uid},'Đã xoá tài khoản',true);return;}
  else if(a==='pgPrev'){pgPrev();return;}
  else if(a==='pgBackup'){pgBackup();return;}
  else if(a==='pgRun'){pgRun();return;}
  else if(a==='impGo'){impGo();return;}
  else if(a==='impReset'){ST.imp={};}
  else if(a==='impCsv'){impCsv();return;}
  else if(a==='invite'){orgCall({op:'invite',email:$('#ivEmail').value,name:$('#ivName').value,nganh:+$('#ivNg').value,asmEmail:$('#ivAsm').value,province:$('#ivProv').value},'Đã tạo trước thành viên');return;}
  else if(a==='rmInvite'){orgCall({op:'removeInvite',email:d.email},'Đã xoá');return;}
  else if(a==='rmAsm'){if(confirm('Xoá ASM '+d.email+'? Nhân sự của ASM này sẽ thành "chưa gán".'))orgCall({op:'removeAsm',email:d.email},'Đã xoá ASM');return;}
  else if(a==='asmGo'){ST.asm=d.v;ST.sd=null;ST.sp=0;ST.sq='';ST.ov=null;loadData();return;}
  else if(a==='spage'){const tot=(ST.sd&&ST.sd.total)||0,last=Math.max(0,Math.ceil(tot/BIG_PAGE)-1),p=ST.sp||0;ST.sp=d.v==='first'?0:d.v==='prev'?Math.max(0,p-1):d.v==='next'?Math.min(last,p+1):last;ST.sd=null;}
  else if(a==='msf'){ST.ms=ST.ms||{q:'',f:'all',k:'risk',d:1};ST.ms.f=ST.ms.f===d.v&&d.v!=='all'?'all':d.v;}
  else if(a==='msort'){ST.ms=ST.ms||{q:'',f:'all',k:'risk',d:1};if(ST.ms.k===d.v)ST.ms.d=-ST.ms.d;else{ST.ms.k=d.v;ST.ms.d=(d.v==='debt'?-1:1);}}
  else if(a==='hday'){ST.hd=d.d;ST.hw=null;}
  else if(a==='hweek'){ST.hw=+d.v;}
  else if(a==='hview'){ST.hv=d.v;ST.hw=null;}
  else if(a==='hstep'){const cur=heatDay(monthDays(ST.month)),nd=addD(cur,+d.v);if(nd.slice(0,7)===ST.month&&nd<=ST.today){ST.hd=nd;ST.hw=null;}}
  else if(a==='nmOpen'){ST.nm=nmNew();}
  else if(a==='nmClose'){if(b.classList.contains('scrim')&&e.target!==b)return;ST.nm=null;}
  else if(a==='nmRole'){nmSync();ST.nm.role=d.v;ST.nm.err='';}
  else if(a==='nmNg'){nmSync();ST.nm[d.v==='1'?'n1':'n2']=!ST.nm[d.v==='1'?'n1':'n2'];}
  else if(a==='nmCreate'){nmCreate();return;}
  else if(a==='nmAgain'){ST.nm=nmNew();}
  else if(a==='nmCopy'){const t=(document.getElementById('nmMsg')||{}).textContent||'';const ok=()=>toast('Đã sao chép thông tin đăng nhập.');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));else fallbackCopy(t,ok);return;}
  else if(a==='ot'){ST.ot=d.v;}
  else if(a==='omf'){ST.om=ST.om||{q:'',f:'all'};ST.om.f=d.v;ST.op=0;}
  else if(a==='opage'){const p=ST.op||0;ST.op=d.v==='first'?0:d.v==='prev'?Math.max(0,p-1):d.v==='next'?p+1:99999;}
  else if(a==='remind'){remindMissing();return;}
  else if(a==='cmail'){ST.compose.text=$('#ctext').value;ST.compose.email=!ST.compose.email;try{localStorage.setItem('asm-mail',ST.compose.email?'1':'0');}catch(e){}}
  else if(a==='czalo'){ST.compose.text=$('#ctext').value;ST.compose.zalo=!ST.compose.zalo;}
  else if(a==='zalo'){openZalo(d.uid);return;}
  else if(a==='selClear'){ST.sel={};}
  else if(a==='composeSel'){const u=Object.keys(ST.sel).filter(k=>ST.sel[k]);if(u.length){openCompose({uids:u,text:''});return;}}
  else if(a==='view'){ST.view=d.v;try{localStorage.setItem('asm-view',d.v);}catch(e){}}
  else return;
  render();
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='impFile'){impFile(t.files&&t.files[0]);return;}
  if(t.id==='asmSel'){ST.asm=t.value;loadData();}
  else if(t.id==='sortSel'){ST.sort=t.value;render();}
  else if(t.dataset.tsel){ST.sel[t.dataset.tsel]=t.checked;render();}
  else if(t.dataset.tselall){const l=ST.tab==='staff'?staffRows(!!ST.data.truncated).list.map(r=>r.c):filterList(members().map(m=>calc(m,ST.date)));l.forEach(c=>{ST.sel[c.m.uid]=t.checked;});render();}
  else if(t.dataset.nsel){ST.nsel[t.dataset.nsel]=t.checked;render();}
  else if(t.dataset.pgkeep){const G=ST.pg;G.keep[t.dataset.pgkeep]=t.checked;G.prev=null;G.confirm='';G.done=null;G.err='';render();}
  else if(t.dataset.orgrole){if(t.value==='asm')orgCall({op:'addAsm',email:t.dataset.orgrole,name:t.dataset.name||''},'Đã cấp quyền ASM');else if(confirm('Bỏ quyền ASM của '+t.dataset.orgrole+'? Nhân sự của họ sẽ thành "chưa gán".'))orgCall({op:'removeAsm',email:t.dataset.orgrole},'Đã bỏ quyền ASM');else render();}
  else if(t.dataset.orgng)orgCall({op:'setNganh',uid:t.dataset.orgng,nganh:+t.value},'Đã đổi ngành');
  else if(t.dataset.orgasm)orgCall({op:'assign',uid:t.dataset.orgasm,asmEmail:t.value,lock:true},'Đã gán ASM');
  else if(t.dataset.orglock)orgCall({op:'assign',uid:t.dataset.orglock,asmEmail:(ST.org.profiles.find(p=>p.uid===t.dataset.orglock)||{}).asmEmail||'',lock:t.checked},t.checked?'Đã khoá':'Đã mở khoá');
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='q'){ST.q=t.value;clearTimeout(ST._qt);ST._qt=setTimeout(render,140);}
  else if(t.dataset.zp){zpSet(t.dataset.zp,t.value);}
  else if(t.id==='ovq'){ST.ovq=t.value;clearTimeout(ST._qt);ST._qt=setTimeout(render,140);}
  else if(t.id==='mq'&&ST.data&&ST.data.truncated){ST.sq=t.value;ST.sp=0;clearTimeout(ST._qt);ST._qt=setTimeout(function(){ST.sd=null;loadStaffPage();},380);}
  else if(t.id==='mq'){ST.ms=ST.ms||{q:'',f:'all',k:'risk',d:1};ST.ms.q=t.value;clearTimeout(ST._qt);ST._qt=setTimeout(render,140);}
  else if(t.id==='oq'){ST.om=ST.om||{q:'',f:'all'};ST.om.q=t.value;ST.op=0;clearTimeout(ST._qt);ST._qt=setTimeout(render,140);}
  else if(t.id==='pgConf'){ST.pg.confirm=t.value;const bt=document.querySelector('[data-act="pgRun"]');if(bt)bt.disabled=!(t.value==='XOA HET'&&!ST.pg.busy);}
  else if(t.dataset.ndraft)ST.ndraft[t.dataset.ndraft]=t.value;   // không dựng lại giao diện khi đang gõ
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(ST.nm){ST.nm=null;render();}else if(ST.mm){ST.mm=null;render();}else if(ST.compose){ST.compose=null;render();}else if(ST.drawer){ST.drawer=null;render();}}
  else if(e.key==='Enter'&&(e.target.id==='lPass'||e.target.id==='lEmail'||e.target.id==='lOtp'))(ST.login.tab==='forgot'?lforgot():lsubmit());
});
// Tự làm mới mỗi phút khi đang mở trang (không ngắt lúc đang gõ / có hộp thoại)
setInterval(function(){if(document.visibilityState==='visible'&&ST.boot==='ready'&&!ST.compose&&!ST.mm&&!ST.nm&&ST.tab!=='plan')loadData(true);},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&ST.boot==='ready'&&!ST.compose&&!ST.mm&&!ST.nm&&ST.tab!=='plan'&&Date.now()-(ST.loadedAt-ST.skew)>30000)loadData(true);});
ST._bp=isNarrow(900)+'|'+isNarrow(700);
window.addEventListener('resize',function(){clearTimeout(ST._rt);ST._rt=setTimeout(function(){const n=isNarrow(900)+'|'+isNarrow(700);if(n!==ST._bp){ST._bp=n;if(ST.boot==='ready'&&!ST.compose&&!ST.mm)render();}},200);});
boot();
})();
</script>
</body>
</html>
